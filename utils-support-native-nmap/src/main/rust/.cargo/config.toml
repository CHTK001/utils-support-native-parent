# cargo 配置
#
# 原先此文件有两个问题，会导致本模块无法在任何环境构建：
#   1. rustflags 中的字符串未闭合："link-arg=-Wl,-rpath,\"
#      其中 \" 被当作转义引号，令 TOML 解析报 unclosed array；
#   2. [build] target 硬编码为 x86_64-unknown-linux-gnu，
#      在非 Linux 主机上直接 cargo build 会跑去交叉编译。
#
# 现改为：不设硬编码默认目标，由 build.sh 显式传 --target 覆盖；
# Linux 专用的 linker 与 rpath 仅挂在 target 段下，只在 Linux 生效。

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"
# $ORIGIN 让 .so 在自身所在目录查找依赖，便于随包分发后仍能找到
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
