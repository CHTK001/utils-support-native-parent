[package]
name = "rust_playwright"
version = "0.1.0"
edition = "2021"
authors = ["CH <ch@utils.com>"]
license = "Apache-2.0"
description = "High-performance Playwright bindings for Java via JNI (headless_chrome / CDP backend)"

[lib]
name = "rust_playwright"
crate-type = ["cdylib"]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
jni = "0.21"
headless_chrome = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
base64 = { version = "0.22", features = ["std"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
