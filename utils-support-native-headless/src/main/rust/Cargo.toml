[package]
name = "headless-rust"
version = "0.2.0"
edition = "2021"

[lib]
name = "headless_rust"
crate-type = ["cdylib"]

[dependencies]
# CDP 驱动真实 Chromium（功能上限 = Chromium 本身，才能对齐 Playwright）
# 0.7 版 API 稳定，显式启用 tokio-runtime（0.7 默认是 async-std）
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
# 异步运行时
tokio = { version = "1.35", features = ["full"] }
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 错误处理
anyhow = "1.0"
# 单例支持
once_cell = "1.19"
# 日志
log = "0.4"
env_logger = "0.10"
# 给 apiRequest 用的直连 HTTP（不走浏览器）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# http body 类型（reqwest 精简特性下显式依赖更稳）
http-body-util = "0.1"
# futures 工具（chromiumoxide handler 需要）
futures = "0.3"
# base64（截图/PDF 输出信封）
base64 = "0.22"
