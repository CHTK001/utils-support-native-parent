name: native-java-compile

# 验证 utils-support-native-parent 各模块 **Java 侧** 能否编译。
#
# 为什么需要这个 workflow：既有的 6 个 native workflow 只构建 C/Rust、校验导出与架构、
# 跑原生侧冒烟，**没有一个会编译 Java**。而 2026-09-29 刚把 sqlite 的 FFM 绑定
# （SqliteHookBridge）下沉进 native 模块，绑定类若写错（方法名、签名、import），
# 在 push 后不会有任何自动化发现——必须等人本地 mvn compile 才暴露。
#
# 为什么需要凭据：本仓 pom 声明的依赖仓库是 packages.aliyun.com 上的私有库
# （server id: 2676178-release-jmLEdB / 2676178-snapshot-FwAJpk），
# 匿名访问返回 HTTP 401，已实测：
#   curl -o /dev/null -w '%{http_code}' \
#     https://packages.aliyun.com/6a62fa1d287d37b037a68ee8/maven/2676178-release-jmledb/com/chua/utils-support-common-starter/4.0.0.42/utils-support-common-starter-4.0.0.42.pom
#   -> 401
# 因此没有凭据时 mvn 无法解析 utils-support-common-starter，本 job 必然失败。
#
# 处理方式：凭据缺失时 **不跑编译，并明确声明「Java 侧未验证」**（warning + summary），
# 不伪装成通过、也不把 CI 弄红。凭据一旦配好，本 job 自动开始真正编译。
#
# 需要的两个 secret（Repository secrets）—— **2026-10-03 已配置**：
#   MAVEN_ALIYUN_USER      阿里云私有仓库用户名
#   MAVEN_ALIYUN_PASSWORD  对应的密码 / 访问令牌
# 两个 server id 共用同一组凭据（同一仓库的两个视图）：已实测两者的
# username 与 password 分别哈希后**完全相同**，故只写一组。
#
# 此前本 workflow 的 paths 过滤写错（`utils-support-native-parent/**`
# 在本仓只匹配到一个 README.md），改真实模块**不触发**，所以那 3 次
# success 全是「跳过编译」，Java 侧实际从未被 CI 覆盖过。
# 已修正过滤并补上 FfmSmoke 步骤，见下方「Java 25 FFM 绑定端到端冒烟」。

on:
  workflow_dispatch:
  push:
    paths:
      # 2026-10-03 修正：原来写的是 `utils-support-native-parent/**`。
      #
      # 本仓的仓名就叫 `utils-support-native-parent`，所以**仓内并不存在**
      # 一层同名目录 —— 只有 `utils-support-native-parent/README.md`
      # 这一个文件（418 字节，无 pom、无源码）。
      #
      # 结果是这个过滤项**能匹配但匹配不到任何真实模块**：改
      # `utils-support-native-sysinformer/**`、`utils-support-native-java8/**`
      # 都不会触发本 workflow。它历史上只跑过 3 次（total_count=3），
      # 而那 3 次的 success 是「凭据缺失 → 跳过编译 → 如实声明未验证」，
      # 不是编译通过。
      #
      # 这与 AGENTS.md 记的「paths 白名单漏掉 = 改门禁不触发门禁」同类：
      # 门禁看起来在，实际从不执行。
      - 'utils-support-native-*/**'
      # 验收脚本本身也是门禁，改它同样要重新编译验证
      - 'tools/sysinformer-accept/**'
      - '.github/workflows/native-java-compile.yml'
  pull_request:
    paths:
      - 'utils-support-native-*/**'
      - 'tools/sysinformer-accept/**'
      # workflow 文件自身也要在 paths 里：只改 CI 定义的 PR 若不触发 CI，
      # 这份配置就会未经检验被合入（判据与 push 侧一致）
      - '.github/workflows/native-java-compile.yml'

concurrency:
  # group 带上事件类型：push 与 workflow_dispatch 落在不同的组，手动触发的 run
  # 就不会被随后的 push 取消。concurrency 对**所有**触发器生效、同组即互相取消。
  group: java-compile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  compile:
    name: mvn clean compile（Java 侧）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 检查是否已配置私有仓库凭据
        id: creds
        env:
          ALIYUN_USER: ${{ secrets.MAVEN_ALIYUN_USER }}
        run: |
          if [ -n "$ALIYUN_USER" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "已检测到 MAVEN_ALIYUN_USER，将执行真实编译。"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Java 侧未验证::未配置 MAVEN_ALIYUN_USER / MAVEN_ALIYUN_PASSWORD，依赖仓库 packages.aliyun.com 匿名访问为 HTTP 401，无法解析 utils-support-common-starter，本 job 跳过真实编译。Java 侧当前只有本地验证，CI 不覆盖。"
          fi

      - name: 生成 settings.xml
        if: steps.creds.outputs.have == 'yes'
        env:
          ALIYUN_USER: ${{ secrets.MAVEN_ALIYUN_USER }}
          ALIYUN_PASS: ${{ secrets.MAVEN_ALIYUN_PASSWORD }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>2676178-release-jmLEdB</id>
                <username>${env.ALIYUN_USER}</username>
                <password>${env.ALIYUN_PASS}</password>
              </server>
              <server>
                <id>2676178-snapshot-FwAJpk</id>
                <username>${env.ALIYUN_USER}</username>
                <password>${env.ALIYUN_PASS}</password>
              </server>
            </servers>
          </settings>
          XML
          # 不打印文件内容（含密码占位引用），只确认结构
          echo "settings.xml 已生成，servers 数 = $(grep -c '<server>' "$HOME/.m2/settings.xml")"

      - name: Java 侧编译（native-parent 全反应堆）
        if: steps.creds.outputs.have == 'yes'
        run: |
          # 用 clean 而非增量：本仓有「增量编译在一次失败后仍保留旧 target/classes，
          # 下次 mvn compile 打印 Nothing to compile 却 BUILD SUCCESS」的历史坑。
          mvn -B -ntp -DskipTests clean compile

      - name: Java 25 FFM 绑定端到端冒烟（FfmSmoke）
        # 未验项 #2 的收口步骤。
        #
        # 在此之前，FfmSmoke 只在本机跑过一次（16 项断言 + 真数据），
        # **CI 从不执行** —— 绑定类写错、方法名改掉、返回结构变形，
        # push 后没有任何自动化能发现。本步骤把它纳入 CI。
        #
        # 依赖已就位：NativeLoader 从 classpath 资源
        # `native/<平台>/libsysinformer.so` 解包到临时目录再加载，
        # 而该 so 是**已跟踪的资源**，mvn compile 会拷进 target/classes，
        # 所以无需手工指定库路径。
        if: steps.creds.outputs.have == 'yes'
        run: |
          set -euo pipefail
          MOD=utils-support-native-sysinformer
          LIB=$MOD/src/main/resources/native/linux-x86_64/libsysinformer.so
          [ -f "$LIB" ] || { echo "找不到入库产物 $LIB"; exit 1; }

          mvn -B -ntp -q -f "$MOD/pom.xml" -DskipTests compile
          mvn -B -ntp -q -f "$MOD/pom.xml" dependency:build-classpath \
            -Dmdep.outputFile=target/cp.txt

          # Linux 上 classpath 分隔符是 ':'（Windows 才用 ';'）
          CP="$MOD/target/classes:$(cat $MOD/target/cp.txt)"
          rm -rf "$MOD/target/smoke-ffm"
          mkdir -p "$MOD/target/smoke-ffm"
          javac -encoding UTF-8 -nowarn -cp "$CP" \
            -d "$MOD/target/smoke-ffm" "$MOD/src/smoke/java/FfmSmoke.java"

          # --enable-native-access=ALL-UNNAMED 是 JEP 472 起对
          # restricted method 的必需开关（java.lang.foreign）。
          set +e
          java --enable-native-access=ALL-UNNAMED \
               -cp "$MOD/target/smoke-ffm:$CP" FfmSmoke 2>&1 | tee /tmp/ffm.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q 'JAVA25_FFM_SMOKE_OK' /tmp/ffm.log \
            || { echo 'FfmSmoke 未打印 JAVA25_FFM_SMOKE_OK'; exit 1; }
          echo "FfmSmoke 退出码 = $rc"

      - name: 结果写入摘要
        if: always()
        run: |
          {
            echo "### Java 侧编译"
            if [ "${{ steps.creds.outputs.have }}" = "yes" ]; then
              echo "已执行 \`mvn -B -DskipTests clean compile\`（全反应堆）。"
              echo ""
              echo "**Java 25 FFM 绑定端到端冒烟（FfmSmoke）已纳入 CI**"
              echo "（2026-10-03，未验项 #2）。"
            else
              echo "**未执行。** 缺少 \`MAVEN_ALIYUN_USER\` / \`MAVEN_ALIYUN_PASSWORD\`，"
              echo "依赖仓库 \`packages.aliyun.com\` 匿名访问为 HTTP 401。"
              echo ""
              echo "在 Repository secrets 里补上这两个 secret 后，本 job 会自动开始编译。"
              echo "在那之前，**native 模块的 Java 侧只有本地验证，CI 不覆盖**——"
              echo "绑定类写错不会在 push 后被任何自动化发现。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
