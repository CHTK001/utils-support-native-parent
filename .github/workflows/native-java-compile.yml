name: native-java-compile

# 验证 utils-support-native-parent 各模块 **Java 侧** 能否编译。
#
# 为什么需要这个 workflow：既有的 6 个 native workflow 只构建 C/Rust、校验导出与架构、
# 跑原生侧冒烟，**没有一个会编译 Java**。而 2026-09-29 刚把 sqlite 的 FFM 绑定
# （SqliteHookBridge）下沉进 native 模块，绑定类若写错（方法名、签名、import），
# 在 push 后不会有任何自动化发现——必须等人本地 mvn compile 才暴露。
#
# 为什么需要凭据：本仓依赖**三个来源**（沿 pom 父链
# `utils-support-parent-starter-4.0.0.42` 上溯得到）：
#   github-resource  https://maven.pkg.github.com/CHTK001/utils-support-resource-parent
#   github           https://maven.pkg.github.com/CHTK001/utils-support-native-parent
#   2676178-release-jmLEdB / 2676178-snapshot-FwAJpk  packages.aliyun.com/...
#
# **2026-10-03 更正此前注释里的错误结论**：原文只查了 aliyun、看到匿名 401
# 就断定「配 aliyun 凭据即可」。实测证明那是错的：
#   aliyun release / snapshot 对 com.chua:utils-support-common-starter:4.0.0.42
#   返回 **404**（带凭据也是 404，不是 401）—— 凭据被接受、路径不存在。
#   而该构件的真实来源是 **GitHub Packages**（`github-resource`），
#   带该 server 凭据取回 200 / 1,843,758 字节。
# **401 与 404 的区别，就是「凭据不对」与「找错仓库」的分界。**
#
# 需要的 secret（Repository secrets）—— 2026-10-03 已配置：
#   MAVEN_ALIYUN_USER / MAVEN_ALIYUN_PASSWORD
#   MAVEN_GITHUB_RESOURCE_USER / MAVEN_GITHUB_RESOURCE_TOKEN
# aliyun 两个 view 实测 username 与 password 分别哈希后完全相同，故只写一组。
#
# **但即便凭据齐全，Java 侧目前仍无法在 CI 上验证**，原因是环境而非凭据：
# 扫描本机 D:\maven-repo 下 com\chua 的 420 个坐标，`_remote.repositories`
# 显示 386 个 jar 的仓库 id 为**空**，即由本机 `mvn install` 装入、从未发布
# 到任何远端。更糟的是唯一发布出去的那份：
#   utils-support-common-starter-4.0.0.42.jar
#     本机 4,558,874 字节  sha1 8d2d6db08670189e60d7d6581f324d9677ae7c2b
#     远端               sha1 05fa22216b0b96b1d908379cf680b7c3b63cde19
#   **同一 GAV 坐标，两份不同字节。** 本机验证用的是本地那份，CI 解析到的
#   是远端那份，CI 全绿也不能证明本机验证的结论。
#
# 因此编译步骤对失败做**分类**：全是依赖解析失败 -> warning + 摘要声明
# 「Java 侧无法验证」且不把 job 弄红；出现任何其他失败（编译错误等）
# -> job 变红。让环境阻塞长期挂红灯，只会让人学会忽略红灯。
#
# 另有：此前本 workflow 的 paths 过滤写错（`utils-support-native-parent/**`
# 在本仓只匹配到一个 README.md），改真实模块**不触发**，所以历史上那 3 次
# success 全是「跳过编译」，Java 侧实际从未被 CI 覆盖过。已修正过滤，
# 并补上 FfmSmoke 步骤，见下方「Java 25 FFM 绑定端到端冒烟」。

on:
  workflow_dispatch:
  push:
    paths:
      # 2026-10-03 修正：原来写的是 `utils-support-native-parent/**`。
      #
      # 本仓的仓名就叫 `utils-support-native-parent`，所以**仓内并不存在**
      # 一层同名目录 —— 只有 `utils-support-native-parent/README.md`
      # 这一个文件（418 字节，无 pom、无源码）。
      #
      # 结果是这个过滤项**能匹配但匹配不到任何真实模块**：改
      # `utils-support-native-sysinformer/**`、`utils-support-native-java8/**`
      # 都不会触发本 workflow。它历史上只跑过 3 次（total_count=3），
      # 而那 3 次的 success 是「凭据缺失 → 跳过编译 → 如实声明未验证」，
      # 不是编译通过。
      #
      # 这与 AGENTS.md 记的「paths 白名单漏掉 = 改门禁不触发门禁」同类：
      # 门禁看起来在，实际从不执行。
      - 'utils-support-native-*/**'
      # 验收脚本本身也是门禁，改它同样要重新编译验证
      - 'tools/sysinformer-accept/**'
      - '.github/workflows/native-java-compile.yml'
  pull_request:
    paths:
      - 'utils-support-native-*/**'
      - 'tools/sysinformer-accept/**'
      # workflow 文件自身也要在 paths 里：只改 CI 定义的 PR 若不触发 CI，
      # 这份配置就会未经检验被合入（判据与 push 侧一致）
      - '.github/workflows/native-java-compile.yml'

concurrency:
  # group 带上事件类型：push 与 workflow_dispatch 落在不同的组，手动触发的 run
  # 就不会被随后的 push 取消。concurrency 对**所有**触发器生效、同组即互相取消。
  group: java-compile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  compile:
    name: mvn clean compile（Java 侧）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 检查是否已配置私有仓库凭据
        id: creds
        env:
          ALIYUN_USER: ${{ secrets.MAVEN_ALIYUN_USER }}
        run: |
          if [ -n "$ALIYUN_USER" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "已检测到 MAVEN_ALIYUN_USER，将执行真实编译。"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Java 侧未验证::未配置 MAVEN_ALIYUN_USER / MAVEN_ALIYUN_PASSWORD，依赖仓库 packages.aliyun.com 匿名访问为 HTTP 401，无法解析 utils-support-common-starter，本 job 跳过真实编译。Java 侧当前只有本地验证，CI 不覆盖。"
          fi

      - name: 生成 settings.xml
        if: steps.creds.outputs.have == 'yes'
        env:
          ALIYUN_USER: ${{ secrets.MAVEN_ALIYUN_USER }}
          ALIYUN_PASS: ${{ secrets.MAVEN_ALIYUN_PASSWORD }}
          GH_USER: ${{ secrets.MAVEN_GITHUB_RESOURCE_USER }}
          GH_TOKEN: ${{ secrets.MAVEN_GITHUB_RESOURCE_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>2676178-release-jmLEdB</id>
                <username>${env.ALIYUN_USER}</username>
                <password>${env.ALIYUN_PASS}</password>
              </server>
              <server>
                <id>2676178-snapshot-FwAJpk</id>
                <username>${env.ALIYUN_USER}</username>
                <password>${env.ALIYUN_PASS}</password>
              </server>
              <server>
                <id>github-resource</id>
                <username>${env.GH_USER}</username>
                <password>${env.GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          # 不打印文件内容（含密码占位引用），只确认结构
          echo "settings.xml 已生成，servers 数 = $(grep -c '<server>' "$HOME/.m2/settings.xml")"

      - name: Java 侧编译（native-parent 全反应堆）
        if: steps.creds.outputs.have == 'yes'
        run: |
          # 用 clean 而非增量：本仓有「增量编译在一次失败后仍保留旧 target/classes，
          # 下次 mvn compile 打印 Nothing to compile 却 BUILD SUCCESS」的历史坑。
          set +e
          mvn -B -ntp -DskipTests clean compile 2>&1 | tee /tmp/mvn.log
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "MVN_COMPILE_OK"
            exit 0
          fi

          # ---- 失败分类 --------------------------------------------------
          # 区分两类失败，处置相反：
          #
          #  (A) 依赖解析失败（com.chua:* 构件远端不存在）
          #      这是**环境阻塞**，不是代码问题。让 job 变红只会让所有人
          #      学会忽略红灯，反而掩盖真正的编译错误。
          #      改为 warning + 明确写入摘要。
          #
          #  (B) 其他失败（编译错误、测试失败、插件缺失等）
          #      这是**代码问题**，必须让 job 变红，否则这个门禁形同虚设。
          #
          # **必须先剔除 Maven 的样板行**再判断。首版把 ERR（全部 [ERROR] 行）
          # 直接和「依赖解析类行数」比大小，结果这些样板行让两者永远不相等：
          #   [ERROR] -> [Help 1]
          #   [ERROR] [Help 1] http://cwiki.apache.org/...DependencyResolutionException
          #   [ERROR] To see the full stack trace of the errors, re-run Maven with -e
          #   [ERROR] Re-run Maven using the -X switch to enable full debug logging.
          #   [ERROR] For more information about the errors ...
          #   [ERROR]   mvn <args> -rf :utils-support-native-ffmpeg
          #   [ERROR] （空行）
          # 于是「全是依赖问题」也判成了 FAIL —— 分类规则本身的缺陷，
          # 表现却像环境问题，很容易误判方向。
          #
          # 样板行清单是拿 run 37096882431 的**真实**日志反推出来的，
          # 不是凭想象列的 —— 第二版就是因为漏了 `[Help 1]`（无 `->` 前缀）
          # 与 `mvn <args> -rf` 而再次误判。用合成日志测不出这类缺口，
          # 因为合成日志里根本没有这些行。
          grep '^\[ERROR\]' /tmp/mvn.log \
            | grep -vE '^\[ERROR\][[:space:]]*$' \
            | grep -vE '\[Help [0-9]+\]' \
            | grep -vE 'To see the full stack trace' \
            | grep -vE 'Re-run Maven using' \
            | grep -vE 'For more information about the errors' \
            | grep -vE 'After correcting the problems' \
            | grep -vE 'mvn <args> -rf' \
            > /tmp/err-real.txt || true
          ERR=$(wc -l < /tmp/err-real.txt | tr -d ' ')
          DEPR=$(grep -cE 'Could not resolve|Could not transfer|absent|Failed to read artifact descriptor|Non-resolvable|Could not collect dependencies|DependencyResolutionException' /tmp/err-real.txt || true)
          CHUA=$(grep -c 'com\.chua' /tmp/err-real.txt || true)
          echo "  剔除样板行后：实质错误 $ERR / 其中依赖解析类 $DEPR / 提及 com.chua $CHUA"
          if [ "$ERR" -gt 0 ] && [ "$ERR" -eq "$DEPR" ] && [ "$CHUA" -gt 0 ]; then
            echo "::warning title=Java 侧无法验证（环境阻塞）::编译失败的**全部**错误都是 com.chua 构件无法从远端解析。实测：com\\chua 下 420 个坐标中 386 个 jar 的 _remote.repositories 仓库 id 为空，即由本机 mvn install 装入 D:\\maven-repo，从未发布到任何远端；且 utils-support-common-starter:4.0.0.42 本地 jar sha1=8d2d6db0… 与远端 GitHub Packages 的 05fa2221… **不是同一份字节**。因此本机验证与 CI 解析到的不是同一个东西。代码本身未被验证。"
            echo "MVN_COMPILE_BLOCKED_BY_MISSING_ARTIFACTS"
            exit 0
          fi

          echo "::error title=Java 编译失败（非依赖解析问题）::请看 /tmp/mvn.log"
          tail -40 /tmp/mvn.log
          exit 1

      - name: Java 25 FFM 绑定端到端冒烟（FfmSmoke）
        # 未验项 #2 的收口步骤。
        #
        # 在此之前，FfmSmoke 只在本机跑过一次（16 项断言 + 真数据），
        # **CI 从不执行** —— 绑定类写错、方法名改掉、返回结构变形，
        # push 后没有任何自动化能发现。本步骤把它纳入 CI。
        #
        # 依赖已就位：NativeLoader 从 classpath 资源
        # `native/<平台>/libsysinformer.so` 解包到临时目录再加载，
        # 而该 so 是**已跟踪的资源**，mvn compile 会拷进 target/classes，
        # 所以无需手工指定库路径。
        if: steps.creds.outputs.have == 'yes'
        run: |
          set -euo pipefail
          MOD=utils-support-native-sysinformer
          LIB=$MOD/src/main/resources/native/linux-x86_64/libsysinformer.so
          [ -f "$LIB" ] || { echo "找不到入库产物 $LIB"; exit 1; }

          mvn -B -ntp -q -f "$MOD/pom.xml" -DskipTests compile
          mvn -B -ntp -q -f "$MOD/pom.xml" dependency:build-classpath \
            -Dmdep.outputFile=target/cp.txt

          # Linux 上 classpath 分隔符是 ':'（Windows 才用 ';'）
          CP="$MOD/target/classes:$(cat $MOD/target/cp.txt)"
          rm -rf "$MOD/target/smoke-ffm"
          mkdir -p "$MOD/target/smoke-ffm"
          javac -encoding UTF-8 -nowarn -cp "$CP" \
            -d "$MOD/target/smoke-ffm" "$MOD/src/smoke/java/FfmSmoke.java"

          # --enable-native-access=ALL-UNNAMED 是 JEP 472 起对
          # restricted method 的必需开关（java.lang.foreign）。
          set +e
          java --enable-native-access=ALL-UNNAMED \
               -cp "$MOD/target/smoke-ffm:$CP" FfmSmoke 2>&1 | tee /tmp/ffm.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -q 'JAVA25_FFM_SMOKE_OK' /tmp/ffm.log \
            || { echo 'FfmSmoke 未打印 JAVA25_FFM_SMOKE_OK'; exit 1; }
          echo "FfmSmoke 退出码 = $rc"

      - name: 结果写入摘要
        if: always()
        run: |
          {
            echo "### Java 侧编译"
            if [ "${{ steps.creds.outputs.have }}" = "yes" ]; then
              if grep -q 'MVN_COMPILE_OK' /tmp/mvn.log 2>/dev/null; then
                echo "已执行 \`mvn -B -DskipTests clean compile\`（全反应堆），**通过**。"
              elif grep -q 'MVN_COMPILE_BLOCKED_BY_MISSING_ARTIFACTS' /tmp/mvn.log 2>/dev/null; then
                echo "**Java 侧仍无法验证 —— 但原因不是缺凭据，而是构件没发布。**"
                echo ""
                echo "编译已实际执行，失败的**全部**错误都是 \`com.chua\` 构件无法从远端解析。"
                echo "已实测："
                echo "- \`com.chua\` 下 420 个坐标中 **386 个 jar** 的 \`_remote.repositories\`"
                echo "  仓库 id 为空，即由本机 \`mvn install\` 装入 \`D:\\maven-repo\`，从未发布到任何远端；"
                echo "- \`utils-support-common-starter:4.0.0.42\` 本机 jar"
                echo "  sha1 \`8d2d6db0…\` 与远端 GitHub Packages 的 \`05fa2221…\` **不是同一份字节**。"
                echo ""
                echo "因此本机验证与 CI 解析到的不是同一个东西 —— **CI 全绿也不能证明本机结论**。"
                echo "Java 侧代码当前**未被任何自动化覆盖**。要真正关闭，需先把构件发布到远端。"
              else
                echo "编译**失败**且不属于依赖解析问题，详见日志。"
              fi
            else
              echo "**未执行。** 缺少 \`MAVEN_ALIYUN_USER\` / \`MAVEN_ALIYUN_PASSWORD\`，"
              echo "依赖仓库 \`packages.aliyun.com\` 匿名访问为 HTTP 401。"
              echo ""
              echo "在 Repository secrets 里补上这两个 secret 后，本 job 会自动开始编译。"
              echo "在那之前，**native 模块的 Java 侧只有本地验证，CI 不覆盖**——"
              echo "绑定类写错不会在 push 后被任何自动化发现。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
