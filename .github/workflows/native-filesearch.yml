name: native-filesearch

# 四平台交叉编译 + 导出符号断言 + 运行时冒烟（Panama FFM，无项目依赖）。
# 产物回填到分支 build/filesearch-native-artifacts，由维护者合并到 main。

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: '构建通过后把四平台产物提交回仓库（默认否）'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'utils-support-native-filesearch/**'
      # JNA 版（Java 8 绑定）改的是同一份动态库的另一半调用路径，
      # 不纳入触发范围就等于该模块的冒烟永不运行。
      - 'utils-support-native-filesearch-java8/**'
      - '.github/workflows/native-filesearch.yml'
  pull_request:
    paths:
      - 'utils-support-native-filesearch/**'
      - 'utils-support-native-filesearch-java8/**'
      - '.github/workflows/native-filesearch.yml'

concurrency:
  # group 带上事件类型：push 与 workflow_dispatch 落在不同的组，手动触发的 run
  # 就不会被随后的 push 取消。concurrency 对**所有**触发器生效、同组即互相取消。
  group: filesearch-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runs-on: windows-2022
            build_os: windows
            build_arch: x86_64
            smoke: true
            # Windows 走 NTFS MFT 直读；GH 的 windows runner 以管理员运行，
            # 因此能真正打开 \\.\X: 读 $MFT（本地非管理员会自动回退 walkdir）
            engine: mft
            lib: file_search.dll
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            build_os: linux
            build_arch: x86_64
            smoke: true
            engine: walkdir
            lib: libfile_search.so
          - platform: darwin-x86_64
            # 中国 macOS runner 已下架 Intel 机型，macos-15 只能跑 arm64；
            # 无 x64 JVM 可做冒烟，这一腿只校验架构与导出符号。
            runs-on: macos-15
            build_os: darwin
            build_arch: x86_64
            smoke: false
            engine: walkdir
            lib: libfile_search.dylib
          - platform: darwin-aarch64
            runs-on: macos-15
            build_os: darwin
            build_arch: aarch64
            smoke: true
            engine: walkdir
            lib: libfile_search.dylib
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Build
        # build.sh 自身用 uname 探测，但矩阵是显式声明的，直接传参更可预期；
        # windows-2022 与 ubuntu/macos runner 均自带 bash。
        run: |
          chmod +x utils-support-native-filesearch/src/main/rust/build.sh
          ./utils-support-native-filesearch/src/main/rust/build.sh \
            "${{ matrix.build_os }}" "${{ matrix.build_arch }}" release

      - name: Verify artifact exists
        run: |
          path="utils-support-native-filesearch/src/main/resources/native/${{ matrix.platform }}/${{ matrix.lib }}"
          test -f "$path" || { echo "missing artifact: $path"; exit 1; }
          ls -la "$path"
          echo "LIB_PATH=$path" >> "$GITHUB_ENV"

      - name: Check exports
        # 四条腿都必须断言。早期把断言挂在 `matrix.smoke == false` 上，
        # 而该条件只有 darwin-x86_64 一腿为真，导致 windows / linux /
        # darwin-aarch64 从不校验导出——linux-x86_64 的 libfile_search.so
        # 因此长期带着 7 个已从源码删除的坏 JNI 导出而无人发现。
        #
        # 不用 nm 做断言：Windows Git Bash 的 nm 不解析 PE/COFF（读出空表），
        # 本模块的 Linux release 构建又剥掉了符号表（nm 报 "no symbols"），
        # 而 `nm -gU ... || nm -g ...` 的兜底是死代码——nm -gU 退出码是 0。
        #
        # 原来那版断言用 `grep -aqF` 字节串搜索，对 PE / ELF / Mach-O 确实都"有效"，
        # 但它是**子串**匹配：期望名若是别的标识符的一部分就会误判为存在。
        # 改成整 token 精确匹配：tr 把所有非标识符字节（含 NUL、换行）替换成换行，
        # 每行恰好一个完整标识符，再用 grep -qxF 要求整行相等。
        # LC_ALL=C 对 tr 和 sort 都必须加：macOS 的 BSD tr 在 UTF-8 locale 下
        # 遇到二进制里的非法多字节序列会报 "Illegal byte sequence" 并非 0 退出。
        # Mach-O 的 C 符号带一个前导下划线（dyld 解析时剥掉），故匹配集合
        # 并入「去掉一个前导下划线」的形式，同一份清单四平台通用。
        run: |
          LC_ALL=C tr -c 'A-Za-z0-9_' '\n' < "$LIB_PATH" | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols.txt"
          sed -e 's/^_//' "$RUNNER_TEMP/symbols.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_norm.txt"
          cat "$RUNNER_TEMP/symbols.txt" "$RUNNER_TEMP/symbols_norm.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_match.txt"
          {
            echo "### ${{ matrix.platform }} 导出的标识符（前 40 个，共 $(wc -l < "$RUNNER_TEMP/symbols.txt") 个）"
            echo '```'
            head -40 "$RUNNER_TEMP/symbols.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          for sym in fast_get_version fast_search_cancel fast_search_by_name \
                     Java_com_chua_filesearch_support_bridge_RustFileSearchBridge__rawSearchByName \
                     Java_com_chua_filesearch_support_bridge_RustFileSearchBridge__rawGetTree; do
            if grep -qxF -- "$sym" "$RUNNER_TEMP/symbols_match.txt"; then
              echo "ASSERT ok   export $sym"
            else
              echo "ASSERT FAIL missing export: $sym"
              exit 1
            fi
          done

          # 已移除的那批坏 JNI 符号不得再出现（getVersion 曾令 JVM 崩溃）。
          # 这里必须同时查「完整 JNI 名」和「裸名」两种形式：换成整 token 匹配后，
          # 一个残留符号的 token 是 Java_com_chua_..._RustFileSearchBridge_getVersion，
          # 与裸名 RustFileSearchBridge_getVersion 是**两个不同的 token**。
          # 只查裸名的话这条守卫会变成永远不可能触发的空断言，等于把回归防护拆了。
          for gone in RustFileSearchBridge_getVersion RustFileSearchBridge_cancel \
                      RustFileSearchBridge_searchByName RustFileSearchBridge_getTree \
                      RustFileSearchBridge_searchBySize RustFileSearchBridge_searchByPath; do
            for cand in "$gone" "Java_com_chua_filesearch_support_bridge_$gone"; do
              if grep -qxF -- "$cand" "$RUNNER_TEMP/symbols_match.txt"; then
                echo "ASSERT FAIL 已移除的 JNI 符号仍存在: $cand"
                exit 1
              fi
              echo "ASSERT ok   removed $cand"
            done
          done

      - name: Check architecture (macOS Intel cross leg)
        if: matrix.smoke == false
        run: |
          lipo -info "$LIB_PATH"
          lipo -archs "$LIB_PATH" | grep -q x86_64 || { echo "ASSERT FAIL not x86_64"; exit 1; }
          echo "ASSERT ok   mach-o x86_64"

      - uses: actions/setup-java@v4
        if: matrix.smoke != false
        with:
          distribution: temurin
          java-version: '25'

      - name: Runtime smoke (Panama FFM, no project deps)
        if: matrix.smoke != false
        run: |
          javac -d target/smoke utils-support-native-filesearch/src/smoke/java/FilesearchFlatAbiSmoke.java
          java --enable-native-access=ALL-UNNAMED -Dstdout.encoding=UTF-8 \
            -cp target/smoke FilesearchFlatAbiSmoke "$(pwd)/$LIB_PATH"

      - name: Engine assertion (MFT 直读 vs walkdir 回退)
        if: matrix.smoke != false
        # 探针文件放在相对深度 5：walkdir 的 max_depth=3 永远看不到它，只有 MFT 直读能命中，
        # 同一探针在两种引擎下结果必然不同，据此断言本次实际走的是哪条路径，并校验 size 回传。
        run: |
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            SCAN_ROOT='C:\'
            # MFT 直读需管理员；若 runner 非管理员必须显式失败，不能悄悄降级成 walkdir
            # 后还断言 mft（那会变成一条永远不真正测 MFT 的假绿用例）。
            if ! net session >/dev/null 2>&1; then
              echo "ASSERT FAIL windows runner 非管理员，无法验证 MFT 直读"
              exit 1
            fi
          else
            SCAN_ROOT="$RUNNER_TEMP"
          fi
          javac -d target/smoke utils-support-native-filesearch/src/smoke/java/FilesearchMftSmoke.java
          java --enable-native-access=ALL-UNNAMED -Dstdout.encoding=UTF-8 \
            -cp target/smoke FilesearchMftSmoke "$(pwd)/$LIB_PATH" "$SCAN_ROOT" "${{ matrix.engine }}"

      - name: Runtime smoke (JNA bridge, Java 8 module)
        if: matrix.smoke != false
        # 上一条只验了 FFM 裸 ABI，JNA 绑定（Java 8 侧唯一的正式绑定）
        # 在 CI 上从未运行过：它有自己的一套 UTF-8 手工编组与 JSON 解析，
        # 平台行为与 FFM 版不同，必须单独跑。
        run: |
          set -e
          mvn -q -B -f utils-support-native-filesearch-java8/pom.xml -DskipTests package
          mvn -q -B -f utils-support-native-filesearch-java8/pom.xml \
            dependency:build-classpath "-Dmdep.outputFile=target/cp.txt"
          # 分隔符必须问 JVM 自己要：dependency:build-classpath 输出的是
          # 平台分隔符（Windows 是 ';'，Linux/macOS 是 ':'），写死 ':' 会让
          # Windows 上整个 target/classes 段被并进第一个 jar 路径，编译报
          # "package ... does not exist"。这条是本 step 唯一的跨平台隐患。
          SEP=$(java -XshowSettings:properties -version 2>&1 |
            sed -n 's/^[[:space:]]*path\.separator = //p')
          CP="utils-support-native-filesearch-java8/target/classes${SEP}$(cat utils-support-native-filesearch-java8/target/cp.txt)"
          javac -encoding UTF-8 -nowarn -cp "$CP" -d target/smoke-jna \
            utils-support-native-filesearch-java8/src/smoke/java/FilesearchJnaBridgeSmoke.java
          # 用本腿刚编出的库覆盖 classpath 抽取，确保测的是当前源码的产物
          java --enable-native-access=ALL-UNNAMED -Dstdout.encoding=UTF-8 \
            "-Dchua.filesearch.native.path=$(pwd)/$LIB_PATH" \
            -cp "target/smoke-jna${SEP}$CP" FilesearchJnaBridgeSmoke

      - name: Engine assertion (JNA bridge, Java 8 module)
        if: matrix.smoke != false
        # 上一条只验功能：MFT 直读与 walkdir 回退都能搜到临时目录里的文件，
        # 判不出本次实际走的是哪条路径。这里用相对深度 5 的探针补上引擎判定，
        # 同时作为 FFM 侧结果的交叉印证 —— 两条 Java 通路调用同一个原生符号。
        # Windows 侧的管理员断言已在上一个 step 做过，这里不重复。
        run: |
          set -e
          # 上一个 step 已生成 target/cp.txt；分隔符同样问 JVM 要，理由见该 step。
          SEP=$(java -XshowSettings:properties -version 2>&1 |
            sed -n 's/^[[:space:]]*path\.separator = //p')
          CP="utils-support-native-filesearch-java8/target/classes${SEP}$(cat utils-support-native-filesearch-java8/target/cp.txt)"
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            SCAN_ROOT='C:\'
          else
            SCAN_ROOT="$RUNNER_TEMP"
          fi
          javac -encoding UTF-8 -nowarn -cp "$CP" -d target/smoke-jna \
            utils-support-native-filesearch-java8/src/smoke/java/FilesearchMftJnaSmoke.java
          java -Dstdout.encoding=UTF-8 \
            "-Dchua.filesearch.native.path=$(pwd)/$LIB_PATH" \
            -cp "target/smoke-jna${SEP}$CP" FilesearchMftJnaSmoke "$SCAN_ROOT" "${{ matrix.engine }}"

      - name: Stage artifact for upload
        run: |
          rm -rf stage
          mkdir -p stage/native/${{ matrix.platform }}
          cp "$LIB_PATH" stage/native/${{ matrix.platform }}/
          ls -la stage/native/${{ matrix.platform }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-filesearch
          path: stage/native
          if-no-files-found: error

  collect:
    name: commit artifacts back
    needs: build
    # always() 保证部分平台失败时已成功平台的产物仍能回填。
    if: >-
      always()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.commit_back))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-filesearch'
          path: dl
          merge-multiple: true
      - name: Place artifacts and push branch
        env:
          ARTIFACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仓库 main 开启 "require pull request"，GITHUB_TOKEN 直接 push main
          # 会被 GH006 拒绝，且本仓库禁止 Actions 创建 PR；故回填到独立分支，
          # 由维护者合并。
          #
          # 基底必须是回填分支自己的上一版，不能是 main。
          # 原因：产物上传排在冒烟 step 之后，某个平台冒红时它本轮没有产物。
          # 旧脚本仍以 main 为基底再 --force，于是把上轮那份好产物覆盖回 main
          # 里的旧值：实测 run@1ef0be8 把 windows 从 4e5cdf29/307712B 退成
          # c705b29c/306688B，而 job 依然全绿、没有任何一行提示。
          # 改用上一版作基底后推送是快进，回退结构上不可能再发生，
          # --force 也就没有存在理由了。
          set -e
          set -o pipefail
          BRANCH="build/filesearch-native-artifacts"
          ART="utils-support-native-filesearch/src/main/resources/native"
          PLATFORMS="windows-x86_64 linux-x86_64 darwin-x86_64 darwin-aarch64"
          # 用进程替换而不是 `2>&1 | tee`：后者会要求 PIPESTATUS 兜错误码，
          # 而代价是 set -e 失效，块中间任何一步失败都会被末尾的 push 掩盖。
          exec > >(tee "$RUNNER_TEMP/commit.log") 2>&1

          echo "== build job: ${{ needs.build.result }} =="
          echo "== dl 实际布局 =="
          find dl -type f | sort | sed 's/^/  /' || true

          BASE=""
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH"
            BASE=$(git rev-parse FETCH_HEAD)
            git checkout -q -B "$BRANCH" "$BASE"
            echo "== 基底: 回填分支上一版 $BASE =="
          else
            git checkout -q -B "$BRANCH"
            echo "== 基底: main（回填分支尚不存在）=="
          fi
          mkdir -p "$ART"

          # 只把本轮真正产出的平台叠上去；没产出的平台保留基底里的上一版产物。
          FRESH=""
          CARRIED=""
          MISSING=""
          for plat in $PLATFORMS; do
            if [ -n "$(ls -A "dl/$plat" 2>/dev/null)" ]; then
              FRESH="$FRESH $plat"
            elif [ -n "$BASE" ] && git cat-file -e "$BASE:$ART/$plat" 2>/dev/null; then
              CARRIED="$CARRIED $plat"
            else
              MISSING="$MISSING $plat"
            fi
          done
          for plat in $FRESH; do
            rm -rf "${ART:?}/$plat"
            cp -R "dl/$plat" "$ART/$plat"
          done

          echo "== 本轮新产出 :$FRESH =="
          echo "== 沿用上一版 :$CARRIED =="
          echo "== 本轮缺失   :$MISSING =="
          # 缺平台必须响，不能只躺在日志里等人翻
          if [ -n "$MISSING" ]; then
            echo "::warning title=回填缺少平台::本轮无产物且基底中也没有：$MISSING，请人工补齐"
          fi

          echo "== 待提交 =="
          git status --porcelain "$ART"
          if git diff --quiet -- "$ART" \
             && [ -z "$(git ls-files --others --exclude-standard "$ART")" ]; then
            echo "与回填分支上一版一致，无需提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add "$ART"
            git commit -m "build(native): filesearch 四平台产物"
            echo "== 快进推送 $BRANCH（无 --force） =="
            git push "https://x-access-token:${ARTIFACT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$BRANCH"
          fi

          {
            echo "### 产物回填明细"
            echo ""
            echo "| 平台 | 来源 |"
            echo "| --- | --- |"
            for plat in $PLATFORMS; do
              case " $FRESH " in
                *" $plat "*) src="本轮新产出";;
                *) src="沿用上一版";;
              esac
              echo "| $plat | $src |"
            done
            echo ""
            echo "build job: ${{ needs.build.result }}；分支 \`$BRANCH\` 已快进推送（不再强推），请维护者合并回 main。"
          } >> "$GITHUB_STEP_SUMMARY"
