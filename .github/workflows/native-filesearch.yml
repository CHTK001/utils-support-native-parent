name: native-filesearch

# 四平台交叉编译 + 导出符号断言 + 运行时冒烟（Panama FFM，无项目依赖）。
# 产物回填到分支 build/filesearch-native-artifacts，由维护者合并到 main。

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: '构建通过后把四平台产物提交回仓库（默认否）'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'utils-support-native-filesearch/**'
      - '.github/workflows/native-filesearch.yml'
  pull_request:
    paths:
      - 'utils-support-native-filesearch/**'

concurrency:
  group: filesearch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runs-on: windows-2022
            build_os: windows
            build_arch: x86_64
            smoke: true
            lib: file_search.dll
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            build_os: linux
            build_arch: x86_64
            smoke: true
            lib: libfile_search.so
          - platform: darwin-x86_64
            # 中国 macOS runner 已下架 Intel 机型，macos-15 只能跑 arm64；
            # 无 x64 JVM 可做冒烟，这一腿只校验架构与导出符号。
            runs-on: macos-15
            build_os: darwin
            build_arch: x86_64
            smoke: false
            lib: libfile_search.dylib
          - platform: darwin-aarch64
            runs-on: macos-15
            build_os: darwin
            build_arch: aarch64
            smoke: true
            lib: libfile_search.dylib
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Build
        # build.sh 自身用 uname 探测，但矩阵是显式声明的，直接传参更可预期；
        # windows-2022 与 ubuntu/macos runner 均自带 bash。
        run: |
          chmod +x utils-support-native-filesearch/src/main/rust/build.sh
          ./utils-support-native-filesearch/src/main/rust/build.sh \
            "${{ matrix.build_os }}" "${{ matrix.build_arch }}" release

      - name: Verify artifact exists
        run: |
          path="utils-support-native-filesearch/src/main/resources/native/${{ matrix.platform }}/${{ matrix.lib }}"
          test -f "$path" || { echo "missing artifact: $path"; exit 1; }
          ls -la "$path"
          echo "LIB_PATH=$path" >> "$GITHUB_ENV"

      - name: Export list (for diagnostics)
        run: |
          {
            echo "### ${{ matrix.platform }} 导出符号"
            echo '```'
            nm -gU "$LIB_PATH" 2>/dev/null || nm -g "$LIB_PATH" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check exports and architecture (no-JVM leg)
        if: matrix.smoke == false
        run: |
          nm -gU "$LIB_PATH" > "$RUNNER_TEMP/exports.txt" || nm -g "$LIB_PATH" > "$RUNNER_TEMP/exports.txt"
          for sym in fast_get_version fast_search_cancel fast_search_by_name \
                     Java_com_chua_filesearch_support_bridge_RustFileSearchBridge__rawSearchByName \
                     Java_com_chua_filesearch_support_bridge_RustFileSearchBridge__rawGetTree; do
            grep -q "$sym" "$RUNNER_TEMP/exports.txt" || { echo "ASSERT FAIL missing export: $sym"; exit 1; }
            echo "ASSERT ok   export $sym"
          done
          # 已移除的那批坏 JNI 符号不得再出现（getVersion 曾令 JVM 崩溃）
          for gone in RustFileSearchBridge_getVersion RustFileSearchBridge_cancel \
                      RustFileSearchBridge_searchByName RustFileSearchBridge_getTree \
                      RustFileSearchBridge_searchBySize RustFileSearchBridge_searchByPath; do
            if grep -q "$gone" "$RUNNER_TEMP/exports.txt"; then
              echo "ASSERT FAIL 已移除的 JNI 符号仍存在: $gone"
              exit 1
            fi
            echo "ASSERT ok   removed $gone"
          done
          lipo -info "$LIB_PATH"
          lipo -archs "$LIB_PATH" | grep -q x86_64 || { echo "ASSERT FAIL not x86_64"; exit 1; }
          echo "ASSERT ok   mach-o x86_64"

      - uses: actions/setup-java@v4
        if: matrix.smoke != false
        with:
          distribution: temurin
          java-version: '25'

      - name: Runtime smoke (Panama FFM, no project deps)
        if: matrix.smoke != false
        run: |
          javac -d target/smoke utils-support-native-filesearch/src/smoke/java/FilesearchFlatAbiSmoke.java
          java --enable-native-access=ALL-UNNAMED -Dstdout.encoding=UTF-8 \
            -cp target/smoke FilesearchFlatAbiSmoke "$(pwd)/$LIB_PATH"

      - name: Stage artifact for upload
        run: |
          rm -rf stage
          mkdir -p stage/native/${{ matrix.platform }}
          cp "$LIB_PATH" stage/native/${{ matrix.platform }}/
          ls -la stage/native/${{ matrix.platform }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-filesearch
          path: stage/native
          if-no-files-found: error

  collect:
    name: commit artifacts back
    needs: build
    # always() 保证部分平台失败时已成功平台的产物仍能回填。
    if: >-
      always()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.commit_back))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-filesearch'
          path: dl
          merge-multiple: true
      - name: Report build outcome per platform
        run: |
          {
            echo "### 已回填的产物"
            echo '```'
            find dl -name '*.so' -o -name '*.dylib' -o -name '*.dll' 2>/dev/null | sed 's#^dl/##' || true
            echo '```'
            echo ""
            echo "build job: ${{ needs.build.result }}；产物推送到分支 \`build/filesearch-native-artifacts\`，请维护者合并回 main。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Place artifacts and push branch
        env:
          ARTIFACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仓库 main 开启 "require pull request"，GITHUB_TOKEN 直接 push main
          # 会被 GH006 拒绝，且本仓库禁止 Actions 创建 PR；故回填到独立分支，
          # 由维护者合并。
          set +e
          set +o pipefail
          LOG="$RUNNER_TEMP/commit.log"
          BRANCH="build/filesearch-native-artifacts"
          {
            mkdir -p utils-support-native-filesearch/src/main/resources/native
            cp -R dl/. utils-support-native-filesearch/src/main/resources/native/
            echo "== 待提交产物 =="
            git status --porcelain utils-support-native-filesearch/src/main/resources/native
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            if git diff --quiet -- utils-support-native-filesearch/src/main/resources/native \
               && [ -z "$(git ls-files --others --exclude-standard \
                    utils-support-native-filesearch/src/main/resources/native)" ]; then
              echo "产物与仓库一致，无需提交"
              exit 0
            fi
            git add utils-support-native-filesearch/src/main/resources/native
            git commit -m "build(native): filesearch 四平台产物"
            echo "== push branch $BRANCH =="
            git push --force "https://x-access-token:${ARTIFACT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$BRANCH"
          } 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 1200 "$LOG" | tr -d '\r' | tr '\n' '%0A')
            echo "::error title=回填失败（exit $code）::$msg"
            exit "$code"
          fi
          echo "产物已推送到 $BRANCH，等待维护者合并"
