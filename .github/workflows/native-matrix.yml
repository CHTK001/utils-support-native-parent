name: native-matrix

# 其余 native 模块的四平台交叉编译。与既有的一模块一 workflow
# （native-libjpeg-turbo / native-filesearch /
#   native-nmap / native-datarecovery）互补，覆盖尚未有 CI 的模块。
#
# 产物回填到分支 build/native-matrix-artifacts，由维护者合并到 main。

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: '构建通过后把产物提交回仓库（默认否）'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'utils-support-native-filestorage/**'
      - 'utils-support-native-headless/**'
      - 'utils-support-native-metrics/**'
      - 'utils-support-native-smb/**'
      - 'utils-support-native-video-codec/**'
      - 'utils-support-native-video-processor/**'
      - 'utils-support-native-ffmpeg/**'
      - '.github/workflows/native-matrix.yml'
  pull_request:
    paths:
      - 'utils-support-native-filestorage/**'
      - 'utils-support-native-headless/**'
      - 'utils-support-native-metrics/**'
      - 'utils-support-native-smb/**'
      - 'utils-support-native-video-codec/**'
      - 'utils-support-native-video-processor/**'
      - 'utils-support-native-ffmpeg/**'
      - '.github/workflows/native-matrix.yml'

concurrency:
  # group 带上事件类型：push 与 workflow_dispatch 落在不同的组，手动触发的 run
  # 就不会被随后的 push 取消。concurrency 对**所有**触发器生效、同组即互相取消。
  group: native-matrix-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        module:
          - utils-support-native-filestorage
          - utils-support-native-headless
          - utils-support-native-metrics
          - utils-support-native-smb
          - utils-support-native-video-codec
          - utils-support-native-video-processor
          - utils-support-native-ffmpeg
        platform:
          - windows-x86_64
          - linux-x86_64
          - darwin-x86_64
          - darwin-aarch64
    name: ${{ matrix.module }} / ${{ matrix.platform }}
    # macos-15 只能跑 arm64：darwin-x86_64 一腿仅做交叉编译与导出/架构断言
    runs-on: >-
      ${{ matrix.platform == 'windows-x86_64' && 'windows-2022'
          || matrix.platform == 'linux-x86_64' && 'ubuntu-22.04'
          || 'macos-15' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build params
        id: p
        run: |
          case "${{ matrix.platform }}" in
            windows-x86_64) echo "bos=windows" >> "$GITHUB_OUTPUT"; echo "arch=x86_64"  >> "$GITHUB_OUTPUT"; echo "lib=lib%s"    >> "$GITHUB_OUTPUT"; echo "dll=1" >> "$GITHUB_OUTPUT" ;;
            linux-x86_64)   echo "bos=linux"   >> "$GITHUB_OUTPUT"; echo "arch=x86_64"  >> "$GITHUB_OUTPUT"; echo "lib=lib%s.so" >> "$GITHUB_OUTPUT" ;;
            darwin-x86_64)  echo "bos=darwin"  >> "$GITHUB_OUTPUT"; echo "arch=x86_64"  >> "$GITHUB_OUTPUT"; echo "lib=lib%s.dylib" >> "$GITHUB_OUTPUT" ;;
            darwin-aarch64) echo "bos=darwin"  >> "$GITHUB_OUTPUT"; echo "arch=aarch64" >> "$GITHUB_OUTPUT"; echo "lib=lib%s.dylib" >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ matrix.module }}" in
            *filestorage)     echo "stem=file_storage" >> "$GITHUB_OUTPUT" ;;
            *headless)        echo "stem=headless_rust" >> "$GITHUB_OUTPUT" ;;
            *metrics)         echo "stem=metrics_native" >> "$GITHUB_OUTPUT" ;;
            *smb)             echo "stem=rust_smb_server" >> "$GITHUB_OUTPUT" ;;
            *video-codec)     echo "stem=chua_native_video_codec" >> "$GITHUB_OUTPUT" ;;
            *video-processor) echo "stem=video_processor" >> "$GITHUB_OUTPUT" ;;
            *ffmpeg)          echo "stem=ffmpeg_rust" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        run: |
          R="${{ matrix.module }}/src/main/rust"
          if [ ! -d "$R" ]; then R="${{ matrix.module }}/src/rust"; fi
          chmod +x "$R/build.sh"
          "$R/build.sh" "${{ steps.p.outputs.bos }}" "${{ steps.p.outputs.arch }}" release

      - name: Verify artifact exists
        run: |
          D="${{ matrix.module }}/src/main/resources/native/${{ matrix.platform }}"
          if [ "${{ steps.p.outputs.dll }}" = "1" ]; then
            EXPECT="${{ steps.p.outputs.stem }}.dll"
          else
            EXPECT=$(printf "${{ steps.p.outputs.lib }}" "${{ steps.p.outputs.stem }}")
          fi
          test -f "$D/$EXPECT" || { echo "missing artifact: $D/$EXPECT"; ls -la "$D" || true; exit 1; }
          ls -la "$D/$EXPECT"
          echo "LIB_PATH=$D/$EXPECT" >> "$GITHUB_ENV"

      - name: Check exports
        # 不用 nm 做这件事。实测三种情况下 nm 都给不出可用符号表：
        #   1) Windows Git Bash 的 nm 不解析 PE/COFF，对 dll 只往 stderr 写 "no symbols"；
        #   2) ffmpeg / smb 的 Linux release 构建剥掉了符号表，nm 同样报 "no symbols"；
        #   3) 关键细节：`nm -gU` 在这两种情况下**退出码是 0**，只输出空表。所以原先那句
        #      `nm -gU ... || nm -g ...` 的兜底从来没执行过，它是死代码；exports.txt 恒为空，
        #      期望清单的第一个符号必然失败。
        # 结果是 6 个 windows 腿 + ffmpeg/smb 的 linux 腿（共 8 个 job）的 Check exports 全红，
        # 而这些期望**一次都没有被真正验证过**。用真实导出表核对过：7 个模块 × 2 个平台
        # 共 20 个期望符号全部真实存在，零缺失 —— 红的从来不是库，是校验器。
        #
        # 改成对二进制做「整 token 精确匹配」：tr 把所有非标识符字节（含 NUL、换行）替换成换行，
        # 于是每一行恰好是一个完整标识符，再用 grep -qxF 要求整行相等。
        #
        # 这里**不能**用 filesearch 那套 `grep -aqF` 固定串搜索。期望清单里有三个名字是别的
        # 标识符的子串，固定串搜索会把它们判成"存在"，即静默假通过：
        #   screenshot            ⊂ screenshot_with_check
        #   metrics_start_sampler ⊂ Rust v0 mangled 名（…14metrics_native21metrics_start_sampler0uEs_…）
        #   ..._h264Decode        是 ..._h264DecoderCreate / ..._h264DecoderFree 的前缀
        # 整 token 匹配对这三处都正确拒绝（已用截断负例验证）。
        #
        # LC_ALL=C 对 tr 和 sort 都必须加，不能只加 sort。macOS 的 BSD tr 在 UTF-8 locale 下
        # 遇到二进制里的非法多字节序列会直接报 "tr: Illegal byte sequence" 并以非 0 退出，
        # 于是 14 条 darwin 腿全红（linux/windows 的 GNU tr 按字节处理，所以本地与前两者看不出来）。
        # 置 C locale 让 tr 进入字节模式，非法字节与其他非标识符字节一样被替换成换行。
        #
        # Mach-O 的 C 符号在符号表里带**一个前导下划线**，dyld 解析时才剥掉。所以 dylib 里是
        # `_native_get_version`，而 PE/ELF 里是 `native_get_version`；`dlsym` / Java NativeLoader
        # 用裸名就能取到，运行期完全正常，库本身没问题。CI run 36420746600 里 12 条 darwin 腿报的
        # `ASSERT FAIL missing export: native_get_version` 就是这个原因：`_` 属于标识符字符，
        # token 是 `_native_get_version`，而 `grep -qxF` 要求整行相等，裸名必然匹配不上。
        # 匹配用的集合因此额外并入「去掉一个前导下划线」的形式，同一份期望清单四个平台通用。
        # 摘要里仍打原始 token，便于人工排查真实符号名。
        run: |
          LC_ALL=C tr -c 'A-Za-z0-9_' '\n' < "$LIB_PATH" | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols.txt"
          sed -e 's/^_//' "$RUNNER_TEMP/symbols.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_norm.txt"
          cat "$RUNNER_TEMP/symbols.txt" "$RUNNER_TEMP/symbols_norm.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_match.txt"
          {
            echo "### ${{ matrix.module }} / ${{ matrix.platform }} 导出的标识符（前 40 个，共 $(wc -l < "$RUNNER_TEMP/symbols.txt") 个）"
            echo '```'
            head -40 "$RUNNER_TEMP/symbols.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "${{ matrix.module }}" in
            *filestorage)     NEED="native_get_version native_init" ;;
            *headless)        NEED="download_page screenshot free_string" ;;
            *metrics)         NEED="metrics_start_sampler metrics_stop_sampler metrics_snapshot_size metrics_get_snapshot" ;;
            *smb)             NEED="smb_server_start smb_server_stop smb_server_list_shares smb_server_free_string" ;;
            *video-codec)     NEED="Java_com_chua_nativevideocodec_support_NativeVideoCodec_getVersion Java_com_chua_nativevideocodec_support_NativeVideoCodec_h264Decode" ;;
            *video-processor) NEED="Java_com_chua_video_processor_support_bridge_VideoProcessorBridge_transcodeToHls Java_com_chua_video_processor_support_bridge_VideoProcessorBridge_getVersion" ;;
            *ffmpeg)          NEED="ffmpeg_version ffmpeg_codec_available ffmpeg_free_string" ;;
          esac
          test -n "$NEED" || { echo "ASSERT FAIL no expectation defined for module ${{ matrix.module }}"; exit 1; }
          # 导出给后续步骤。NEED 原先只是本步骤的 shell 局部变量，跨步骤不存在；
          # 后面的运行时冒烟直接引用 $NEED 会拿到空值，dlsym 循环静默空转——
          # 那会让冒烟退化成「只 dlopen 不解析符号」。
          echo "NEED=$NEED" >> "$GITHUB_ENV"
          for s in $NEED; do
            grep -qxF -- "$s" "$RUNNER_TEMP/symbols_match.txt" \
              || { echo "ASSERT FAIL missing export: $s"; exit 1; }
            echo "ASSERT ok   $s"
          done
          if [ "${{ matrix.platform }}" = "darwin-x86_64" ]; then
            lipo -info "$LIB_PATH"
            lipo -archs "$LIB_PATH" | grep -q x86_64 || { echo "ASSERT FAIL not x86_64"; exit 1; }
            echo "ASSERT ok   mach-o x86_64"
          fi

      - name: Check architecture
        # 原先只有 darwin-x86_64 一腿通过 lipo 校验架构，windows / linux /
        # darwin-aarch64 三腿**完全没有架构断言** —— 构建脚本把架构参数接错、
        # 或产物被写成了别的架构，都不会被 CI 发现。这里补一条四平台通用断言，
        # 直读容器头（`file` 的判定来自二进制头而非扩展名）。
        run: |
          file "$LIB_PATH"
          case "${{ matrix.platform }}" in
            windows-x86_64) NEED_PAT='PE32\+.*x86-64' ;;
            linux-x86_64)   NEED_PAT='ELF 64-bit.*x86-64' ;;
            darwin-x86_64)  NEED_PAT='Mach-O 64-bit.*x86_64' ;;
            darwin-aarch64) NEED_PAT='Mach-O 64-bit.*arm64' ;;
            *) echo "ASSERT FAIL 未定义平台 ${{ matrix.platform }} 的期望架构"; exit 1 ;;
          esac
          file "$LIB_PATH" | grep -qE "$NEED_PAT" \
            || { echo "ASSERT FAIL architecture mismatch, expected /$NEED_PAT/"; exit 1; }
          echo "ASSERT ok   architecture /$NEED_PAT/"

      - name: Runtime smoke (dlopen + dlsym + safe call)
        # darwin-x86_64 一腿跳过：该腿在 arm64 runner 上交叉编译出 x86_64 dylib，
        # 而本机 python 是 arm64，无法 dlopen 异架构库。与其它 workflow 的
        # smoke=false 处理一致；该腿仍有导出与架构断言。
        if: matrix.platform != 'darwin-x86_64'
        # 这一层是 token 匹配**证明不了**的：名字出现在文件里不等于它是个导出
        # （可能只是数据或调试字符串），更不等于库能加载。这里真的把库加载进来，
        # 让动态链接器逐个解析期望符号，并对能够安全调用的导出断言返回值。
        #
        # 调用安全性逐个读 Rust 源码确认过，不是猜的：
        #   headless  free_string(ptr)        -> if ptr.is_null() { return; }
        #   smb       smb_server_stop(h)      -> if handle_ptr <= 0 { return -1; }
        #             smb_server_list_shares  -> if handle_ptr <= 0 { return null; }
        #             smb_server_free_string  -> if s.is_null() { return; }
        #   filestorage native_get_version()  -> 无参，返回常量 "1.1.0"
        #   ffmpeg    ffmpeg_version()        -> 无参，返回常量
        #
        # metrics / video-codec / video-processor 是 JNI 模块，导出的是 Java_*
        # 入口，没有 JVM 就无法调用，这三者止于「加载 + 符号解析」——这仍比
        # 文本匹配强，因为它要求动态链接器真的能解析出每个名字。
        run: |
          # 用 GitHub 的表达式取模块名，再由 bash 剥前缀。
          # 不能写 ${matrix.module##...}：那是 bash 参数展开，而 matrix.module 不是
          # shell 变量，bash 会报 "bad substitution" 并让整步 exit 1。
          # （此前正是这个写法把 28 条腿全弄红了。）
          MOD_FULL="${{ matrix.module }}"
          MOD_SHORT="${MOD_FULL##utils-support-native-}"
          echo "MOD_SHORT=$MOD_SHORT"
          # -X utf8 必须加：CI 的 Windows Python 默认 stdout 编码是 cp1252（英文
          # locale），接下来要打印的中文断言文案会让 print 抛 UnicodeEncodeError，
          # 于是 dlopen/dlsym 全都过了、却崩在打印上。实测 5 个模块挂、2 个过，
          # 分界正是「成功路径是否打印中文」。本机测不出来是因为本机是中文 locale
          # （cp936 能编中文）—— 典型的「本地过、CI 不过」。
          python3 -X utf8 - "$LIB_PATH" "$NEED" "$MOD_SHORT" <<'PY'
          import ctypes
          import sys
          from ctypes import c_char_p, c_int, c_void_p

          # 强制 stdout 用 UTF-8。CI 的 Windows Python 默认按 locale 编码输出
          # （英文 locale -> cp1252），编不出断言文案里的中文，print 会抛
          # UnicodeEncodeError，表现为「dlopen/dlsym 全过、却崩在打印上」。
          # 命令行已加 -X utf8；这里再显式 reconfigure 一次，因为
          # PYTHONIOENCODING 会覆盖 UTF-8 模式，而 reconfigure 覆盖一切。
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
              sys.stderr.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          lib_path, symbols, module = sys.argv[1], sys.argv[2].split(), sys.argv[3]

          # 空清单必须响亮失败。此前 NEED 是上一步的 shell 局部变量，跨步骤拿到空值，
          # 于是循环空转、只 dlopen 不解析符号，却照样打印 MATRIX_SMOKE_OK ——
          # 一条看着绿、实际什么都没验的用例。这里把它变成硬失败。
          if not symbols:
              print("ASSERT FAIL 期望符号清单为空，冒烟会退化成「只 dlopen」")
              print("MATRIX_SMOKE_FAILED failures=1")
              sys.exit(1)

          try:
              lib = ctypes.CDLL(lib_path)
          except OSError as exc:
              print(f"ASSERT FAIL dlopen: {exc}")
              sys.exit(1)
          print(f"ASSERT ok   dlopen {lib_path}")

          failures = 0
          for name in symbols:
              try:
                  getattr(lib, name)
              except AttributeError:
                  print(f"ASSERT FAIL dlsym missing: {name}")
                  failures += 1
              else:
                  print(f"ASSERT ok   dlsym {name}")

          if module == "filestorage":
              lib.native_get_version.restype = c_char_p
              v = lib.native_get_version()
              got = v.decode() if v else ""
              if got == "1.1.0":
                  print(f"ASSERT ok   native_get_version() = {got}")
              else:
                  print(f"ASSERT FAIL native_get_version() = {got!r}, expected '1.1.0'")
                  failures += 1
              lib.native_is_initialized.restype = ctypes.c_bool
              print(f"ASSERT ok   native_is_initialized() = {lib.native_is_initialized()}")
              lib.native_get_capabilities.restype = c_char_p
              caps = lib.native_get_capabilities()
              if caps and len(caps) > 0:
                  print(f"ASSERT ok   native_get_capabilities() = {len(caps)} bytes")
              else:
                  print("ASSERT FAIL native_get_capabilities() 返回空")
                  failures += 1
          elif module == "headless":
              lib.free_string.argtypes = [c_void_p]
              lib.free_string(None)
              print("ASSERT ok   free_string(NULL) 未崩溃")
          elif module == "smb":
              lib.smb_server_free_string.argtypes = [c_void_p]
              lib.smb_server_free_string(None)
              print("ASSERT ok   smb_server_free_string(NULL) 未崩溃")
              lib.smb_server_stop.argtypes = [ctypes.c_ssize_t]
              lib.smb_server_stop.restype = c_int
              rc = lib.smb_server_stop(0)
              if rc == -1:
                  print("ASSERT ok   smb_server_stop(0) = -1")
              else:
                  print(f"ASSERT FAIL smb_server_stop(0) = {rc}, expected -1")
                  failures += 1
              lib.smb_server_list_shares.argtypes = [ctypes.c_ssize_t]
              lib.smb_server_list_shares.restype = c_void_p
              p = lib.smb_server_list_shares(0)
              if not p:
                  print("ASSERT ok   smb_server_list_shares(0) = NULL")
              else:
                  print(f"ASSERT FAIL smb_server_list_shares(0) = {p}, expected NULL")
                  failures += 1
          elif module == "ffmpeg":
              lib.ffmpeg_version.restype = c_char_p
              v = lib.ffmpeg_version()
              got = v.decode() if v else ""
              if got.startswith("ffmpeg-rust-wrapper"):
                  print(f"ASSERT ok   ffmpeg_version() = {got}")
              else:
                  print(f"ASSERT FAIL ffmpeg_version() = {got!r}")
                  failures += 1
              lib.ffmpeg_codec_available.argtypes = [c_int]
              lib.ffmpeg_codec_available.restype = c_int
              rc = lib.ffmpeg_codec_available(0)
              if rc == 1:
                  print("ASSERT ok   ffmpeg_codec_available(0) = 1")
              else:
                  print(f"ASSERT FAIL ffmpeg_codec_available(0) = {rc}")
                  failures += 1
          else:
              print(f"ASSERT ok   {module}: JNI 模块，无 JVM 时止于加载与符号解析")

          if failures:
              print(f"MATRIX_SMOKE_FAILED failures={failures}")
              sys.exit(1)
          print("MATRIX_SMOKE_OK")
          PY

      - name: Stage artifact for upload
        run: |
          M="${{ matrix.module }}"; P="${{ matrix.platform }}"
          rm -rf stage; mkdir -p "stage/$M/native/$P"
          cp "$LIB_PATH" "stage/$M/native/$P/"
          ls -la "stage/$M/native/$P"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ matrix.platform }}
          path: stage
          if-no-files-found: error

  collect:
    name: commit artifacts back
    needs: build
    if: >-
      always()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.commit_back))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Report outcome
        run: |
          {
            echo "### 已回填的产物"
            echo '```'
            find dl -name '*.so' -o -name '*.dylib' -o -name '*.dll' 2>/dev/null | sed 's#^dl/##' || true
            echo '```'
            echo ""
            echo "build job: ${{ needs.build.result }}；产物推送到分支 \`build/native-matrix-artifacts\`，请维护者合并回 main。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Place artifacts and push branch
        env:
          ARTIFACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          set +o pipefail
          LOG="$RUNNER_TEMP/commit.log"
          BRANCH="build/native-matrix-artifacts"
          {
            for d in dl/*/; do
              [ -d "$d" ] || continue
              cp -R "$d." .
            done
            echo "== 待提交产物 =="
            git status --porcelain -- 'utils-support-native-*/src/main/resources/native'
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            if git diff --quiet -- 'utils-support-native-*/src/main/resources/native' \
               && [ -z "$(git ls-files --others --exclude-standard 'utils-support-native-*/src/main/resources/native')" ]; then
              echo "产物与仓库一致，无需提交"
              exit 0
            fi
            git add 'utils-support-native-*/src/main/resources/native'
            git commit -m "build(native): matrix 模块四平台产物"
            echo "== push branch $BRANCH =="
            git push --force "https://x-access-token:${ARTIFACT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$BRANCH"
          } 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 1200 "$LOG" | tr -d '\r' | tr '\n' '%0A')
            echo "::error title=回填失败（exit $code）::$msg"
            exit "$code"
          fi
          echo "产物已推送到 $BRANCH，等待维护者合并"
