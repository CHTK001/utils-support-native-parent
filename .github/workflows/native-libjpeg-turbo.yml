name: native-libjpeg-turbo

# 三平台产物构建 + 运行时冒烟门。
# 每个 job 在自己的目标平台上原生构建（不交叉），避免 nasm/NEON 与 Apple Silicon
# 的工具链 hack；产物字节由 actions 上传，是否回提交由 workflow_dispatch 的输入决定。

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: '构建通过后把各平台产物提交回仓库（默认否）'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'utils-support-native-libjpeg-turbo/**'
      - '.github/workflows/native-libjpeg-turbo.yml'
  pull_request:
    paths:
      - 'utils-support-native-libjpeg-turbo/**'
      - '.github/workflows/native-libjpeg-turbo.yml'

concurrency:
  # group 带上事件类型：push 与 workflow_dispatch 落在不同的组，手动触发的 run
  # 就不会被随后的 push 取消。concurrency 对**所有**触发器生效、同组即互相取消。
  group: turbojpeg-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runs-on: windows-2022
            build_os: windows
            build_arch: x86_64
            smoke: true
            lib: chua_native_turbojpeg.dll
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            build_os: linux
            build_arch: x86_64
            smoke: true
            lib: libchua_native_turbojpeg.so
          - platform: darwin-x86_64
            # 托管 macOS runner 已无 Intel 镜像（macos-13 下架），只能在 arm64 上交叉编；
            # 没有 x64 JVM 可加载它，故这一腿只验产物架构与导出符号，不跑 FFM 冒烟。
            runs-on: macos-15
            build_os: darwin
            build_arch: x86_64
            smoke: false
            lib: libchua_native_turbojpeg.dylib
          - platform: darwin-aarch64
            runs-on: macos-15
            build_os: darwin
            build_arch: aarch64
            smoke: true
            lib: libchua_native_turbojpeg.dylib
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm/cmake (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake ninja-build

      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm cmake ninja

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y
            $env:Path += ';C:\Program Files\NASM'
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Toolchain versions
        run: |
          cmake --version | head -1
          nasm -v || nasm --version
          rustc --version
          cargo --version

      - name: Build (Windows)
        if: matrix.build_os == 'windows'
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File utils-support-native-libjpeg-turbo/src/main/rust/build.ps1

      - name: Build (Linux / macOS)
        if: matrix.build_os != 'windows'
        run: |
          chmod +x utils-support-native-libjpeg-turbo/src/main/rust/build.sh
          ./utils-support-native-libjpeg-turbo/src/main/rust/build.sh \
            "${{ matrix.build_os }}" "${{ matrix.build_arch }}"

      - name: Verify artifact exists
        run: |
          path="utils-support-native-libjpeg-turbo/src/main/resources/native/${{ matrix.platform }}/${{ matrix.lib }}"
          test -f "$path" || { echo "missing artifact: $path"; exit 1; }
          ls -la "$path"
          echo "LIB_PATH=$path" >> "$GITHUB_ENV"

      - name: Check exports
        # 不用 nm。Windows 的 Git Bash nm 不解析 PE/COFF（只往 stderr 写 "no symbols"，
        # 退出码却是 0），所以 `nm -gU ... || nm -g ...` 的兜底是死代码、exports.txt 恒为空。
        # 改成对二进制做「整 token 精确匹配」：tr 把所有非标识符字节（含 NUL、换行）替换成
        # 换行，每行恰好一个完整标识符，再用 grep -qxF 要求整行相等。
        # LC_ALL=C 对 tr 和 sort 都必须加：macOS 的 BSD tr 在 UTF-8 locale 下遇到二进制里的
        # 非法多字节序列会报 "Illegal byte sequence" 并非 0 退出。Mach-O 的 C 符号带一个
        # 前导下划线（dyld 解析时剥掉），故匹配集合并入「去掉一个前导下划线」的形式，
        # 同一份清单四平台通用。
        run: |
          LC_ALL=C tr -c 'A-Za-z0-9_' '\n' < "$LIB_PATH" | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols.txt"
          sed -e 's/^_//' "$RUNNER_TEMP/symbols.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_norm.txt"
          cat "$RUNNER_TEMP/symbols.txt" "$RUNNER_TEMP/symbols_norm.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_match.txt"
          {
            echo "### ${{ matrix.platform }} 导出的标识符（前 40 个，共 $(wc -l < "$RUNNER_TEMP/symbols.txt") 个）"
            echo '```'
            head -40 "$RUNNER_TEMP/symbols.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for sym in chua_tj_compress chua_tj_probe chua_tj_decompress chua_tj_free chua_tj_version chua_tj_last_error; do
            if grep -qxF -- "$sym" "$RUNNER_TEMP/symbols_match.txt"; then
              echo "ASSERT ok   export $sym"
            else
              echo "ASSERT FAIL missing export: $sym"
              exit 1
            fi
          done

      - name: Check mach-o architecture
        if: matrix.smoke == false
        run: |
          file "$LIB_PATH"
          lipo -info "$LIB_PATH"
          lipo -archs "$LIB_PATH" | grep -q x86_64 || { echo "ASSERT FAIL not x86_64"; exit 1; }
          echo "ASSERT ok   mach-o x86_64"

      - uses: actions/setup-java@v4
        if: matrix.smoke != false
        with:
          distribution: temurin
          java-version: '25'

      - name: Runtime round trip (Panama FFM, no project deps)
        # 原来的冒烟引用 src/smoke/java/ChuaTurboJpegSmoke.java，该文件在 81c6781
        # 被搬到 src/test/java/ChuaTurboJpegExample.java，又在 514316e
        # （迁入 TurboJpegBridge FFM 绑定）里被删除，现在全仓都不存在，
        # 于是 run 36501895966 的 windows / linux / darwin-aarch64 三条腿都报
        # `error: file not found`。darwin-x86_64 绿只是因为它 smoke=false，从没跑到这步。
        #
        # TurboJpegBridge 本身不能用在这里：它 import 了
        # com.chua.common.support.utils.NativeLoader 并用 Lombok 的 @Slf4j，
        # 依赖 utils-support-common-starter，而这个 workflow 刻意保持零项目依赖。
        # 所以这里直接用 Panama FFM 绑 6 个 C 导出做一次真实的
        # 压缩 -> 探头 -> 解码 往返，不引入任何项目类。
        if: matrix.smoke != false
        run: |
          mkdir -p target/smoke
          cat > target/smoke/TurboJpegRoundTrip.java <<'JAVA'
          import java.lang.foreign.Arena;
          import java.lang.foreign.FunctionDescriptor;
          import java.lang.foreign.Linker;
          import java.lang.foreign.MemorySegment;
          import java.lang.foreign.SymbolLookup;
          import java.lang.foreign.ValueLayout;
          import java.lang.invoke.MethodHandle;
          import java.nio.file.Path;

          public final class TurboJpegRoundTrip {
            private static final int TJPF_RGB = 0;
            private static final int TJSAMP_444 = 0;
            private static final int W = 64;
            private static final int H = 48;
            private static final int QUALITY = 100;

            private static void check(boolean ok, String what) {
              if (!ok) {
                throw new AssertionError("ASSERT FAIL: " + what);
              }
              System.out.println("ASSERT ok   " + what);
            }

            /**
             * 读一个以 NUL 结尾的 C 字符串。
             *
             * <p>downcall 以 ValueLayout.ADDRESS 返回的是**零长** MemorySegment，
             * 直接 getString(0) 会抛 IndexOutOfBoundsException: No null terminator found，
             * 因为它拿不到扫描边界。必须先 reinterpret 出一个上界再读。
             * 上界取 256 字节足够放版本号和错误描述。
             */
            private static String cstr(MemorySegment segment, Arena arena) {
              return segment.reinterpret(256, arena, null).getString(0);
            }

            public static void main(String[] args) throws Throwable {
              Path lib = Path.of(args[0]).toAbsolutePath();
              Linker linker = Linker.nativeLinker();
              // SymbolLookup 不是 AutoCloseable，它由传入的 Arena 负责生命周期，
              // 所以只把 Arena 放进 try-with-resources。
              try (Arena arena = Arena.ofShared()) {
                SymbolLookup lookup = SymbolLookup.libraryLookup(lib, arena);

                MethodHandle version = linker.downcallHandle(
                        lookup.find("chua_tj_version").orElseThrow(),
                        FunctionDescriptor.of(ValueLayout.ADDRESS));
                MethodHandle lastError = linker.downcallHandle(
                        lookup.find("chua_tj_last_error").orElseThrow(),
                        FunctionDescriptor.of(ValueLayout.ADDRESS));
                MethodHandle free = linker.downcallHandle(
                        lookup.find("chua_tj_free").orElseThrow(),
                        FunctionDescriptor.ofVoid(ValueLayout.ADDRESS));
                MethodHandle compress = linker.downcallHandle(
                        lookup.find("chua_tj_compress").orElseThrow(),
                        FunctionDescriptor.of(ValueLayout.JAVA_INT,
                                ValueLayout.ADDRESS, ValueLayout.JAVA_INT, ValueLayout.JAVA_INT,
                                ValueLayout.JAVA_INT, ValueLayout.JAVA_INT, ValueLayout.JAVA_INT,
                                ValueLayout.JAVA_INT, ValueLayout.JAVA_INT,
                                ValueLayout.ADDRESS, ValueLayout.ADDRESS));
                MethodHandle probe = linker.downcallHandle(
                        lookup.find("chua_tj_probe").orElseThrow(),
                        FunctionDescriptor.of(ValueLayout.JAVA_INT,
                                ValueLayout.ADDRESS, ValueLayout.JAVA_LONG,
                                ValueLayout.ADDRESS, ValueLayout.ADDRESS, ValueLayout.ADDRESS));
                MethodHandle decompress = linker.downcallHandle(
                        lookup.find("chua_tj_decompress").orElseThrow(),
                        FunctionDescriptor.of(ValueLayout.JAVA_INT,
                                ValueLayout.ADDRESS, ValueLayout.JAVA_LONG,
                                ValueLayout.JAVA_INT, ValueLayout.JAVA_INT,
                                ValueLayout.ADDRESS, ValueLayout.ADDRESS,
                                ValueLayout.ADDRESS, ValueLayout.ADDRESS));

                String v = cstr((MemorySegment) version.invokeExact(), arena);
                check(v != null && v.startsWith("3."), "chua_tj_version = " + v);

                // 确定性平滑渐变，用 4:4:4 无色度抽样 + 质量 100，让往返误差可预期地小。
                byte[] pixels = new byte[W * H * 3];
                for (int y = 0; y < H; y++) {
                  for (int x = 0; x < W; x++) {
                    int i = (y * W + x) * 3;
                    pixels[i] = (byte) (x * 4);
                    pixels[i + 1] = (byte) (y * 5);
                    pixels[i + 2] = (byte) 128;
                  }
                }
                MemorySegment src = arena.allocateFrom(ValueLayout.JAVA_BYTE, pixels);
                MemorySegment jpegPtr = arena.allocate(ValueLayout.ADDRESS);
                MemorySegment jpegSize = arena.allocate(ValueLayout.JAVA_LONG);
                int rc = (int) compress.invokeExact(src, W, H, W * 3, TJPF_RGB,
                        QUALITY, TJSAMP_444, 0, jpegPtr, jpegSize);
                if (rc != 0) {
                  throw new AssertionError("ASSERT FAIL: chua_tj_compress rc=" + rc
                          + " err=" + cstr((MemorySegment) lastError.invokeExact(), arena));
                }
                long n = jpegSize.get(ValueLayout.JAVA_LONG, 0);
                MemorySegment jpeg = jpegPtr.get(ValueLayout.ADDRESS, 0);
                check(n > 0, "chua_tj_compress produced " + n + " bytes");

                MemorySegment pw = arena.allocate(ValueLayout.JAVA_INT);
                MemorySegment ph = arena.allocate(ValueLayout.JAVA_INT);
                MemorySegment pss = arena.allocate(ValueLayout.JAVA_INT);
                rc = (int) probe.invokeExact(jpeg, n, pw, ph, pss);
                if (rc != 0) {
                  throw new AssertionError("ASSERT FAIL: chua_tj_probe rc=" + rc
                          + " err=" + cstr((MemorySegment) lastError.invokeExact(), arena));
                }
                check(pw.get(ValueLayout.JAVA_INT, 0) == W && ph.get(ValueLayout.JAVA_INT, 0) == H,
                        "chua_tj_probe = " + pw.get(ValueLayout.JAVA_INT, 0) + "x"
                                + ph.get(ValueLayout.JAVA_INT, 0));

                MemorySegment dstPtr = arena.allocate(ValueLayout.ADDRESS);
                MemorySegment dw = arena.allocate(ValueLayout.JAVA_INT);
                MemorySegment dh = arena.allocate(ValueLayout.JAVA_INT);
                MemorySegment dp = arena.allocate(ValueLayout.JAVA_INT);
                rc = (int) decompress.invokeExact(jpeg, n, TJPF_RGB, 0, dstPtr, dw, dh, dp);
                if (rc != 0) {
                  throw new AssertionError("ASSERT FAIL: chua_tj_decompress rc=" + rc
                          + " err=" + cstr((MemorySegment) lastError.invokeExact(), arena));
                }
                MemorySegment dst = dstPtr.get(ValueLayout.ADDRESS, 0);
                int outW = dw.get(ValueLayout.JAVA_INT, 0);
                int outH = dh.get(ValueLayout.JAVA_INT, 0);
                int pitch = dp.get(ValueLayout.JAVA_INT, 0);
                check(outW == W && outH == H && pitch >= W * 3,
                        "chua_tj_decompress = " + outW + "x" + outH + " pitch=" + pitch);

                // dst 同样是零长原生指针，按 pitch * height 给出上界后才能按字节索引。
                MemorySegment out = dst.reinterpret((long) pitch * outH, arena, null);
                int worst = 0;
                for (int y = 0; y < outH; y++) {
                  for (int x = 0; x < outW; x++) {
                    int si = (y * W + x) * 3;
                    int di = y * pitch + x * 3;
                    for (int c = 0; c < 3; c++) {
                      // 两边都必须先 & 0xFF。ValueLayout.JAVA_BYTE 取回的是 byte，
                      // 直接参与 int 减法会符号扩展：真值 128 变成 -128、127 仍是 +127，
                      // 于是 |−128 − 127| = 255，明明只差 1 却报出最大误差 255。
                      // 这个坑在本地首次跑时真实出现过，掩码打印把它掩盖了。
                      int got = out.get(ValueLayout.JAVA_BYTE, di + c) & 0xFF;
                      int want = pixels[si + c] & 0xFF;
                      int d = Math.abs(got - want);
                      if (d > worst) {
                        worst = d;
                      }
                    }
                  }
                }
                check(worst <= 8, "round trip max channel delta = " + worst);

                free.invokeExact(jpeg);
                free.invokeExact(dst);
                System.out.println("ROUND_TRIP_OK");
              }
            }
          }
          JAVA
          javac -d target/smoke target/smoke/TurboJpegRoundTrip.java
          java --enable-native-access=ALL-UNNAMED -Dstdout.encoding=UTF-8 \
            -cp target/smoke TurboJpegRoundTrip "$(pwd)/$LIB_PATH"

      - name: Stage artifact for upload
        run: |
          rm -rf stage
          mkdir -p stage/native/${{ matrix.platform }}
          cp "$LIB_PATH" stage/native/${{ matrix.platform }}/
          ls -la stage/native/${{ matrix.platform }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-turbojpeg
          path: stage/native
          if-no-files-found: error

  collect:
    name: commit artifacts back
    needs: build
    # always() 保证部分平台失败时成功平台的产物仍能回填。
    # push 与手动 dispatch 都触发，回填用 workflow 自带 GITHUB_TOKEN。
    if: >-
      always()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.commit_back))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-turbojpeg'
          path: dl
          merge-multiple: true
      - name: Report build outcome per platform
        run: |
          echo "### 已回填的产物" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dl -name '*.so' -o -name '*.dylib' -o -name '*.dll' 2>/dev/null \
            | sed 's#^dl/##' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "build job: ${{ needs.build.result }}（产物已推送到分支 \`build/libjpeg-native-artifacts\`，由维护者合并进 main）" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Place artifacts and push branch
        env:
          ARTIFACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仓库 main 启用 "require pull request" 保护，GITHUB_TOKEN 直推 main
          # 会被 GH006 拒绝；且仓库设置禁止 Actions 创建 PR。
          # 但推送到非保护的新分支是允许的，因此改为推分支，由维护者合并。
          set +e
          set +o pipefail
          LOG="$RUNNER_TEMP/commit.log"
          BRANCH="build/libjpeg-native-artifacts"
          {
            mkdir -p utils-support-native-libjpeg-turbo/src/main/resources/native
            cp -R dl/. utils-support-native-libjpeg-turbo/src/main/resources/native/
            echo "== 待提交内容 =="
            git status --porcelain utils-support-native-libjpeg-turbo/src/main/resources/native
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            if git diff --quiet -- utils-support-native-libjpeg-turbo/src/main/resources/native \
               && [ -z "$(git ls-files --others --exclude-standard \
                    utils-support-native-libjpeg-turbo/src/main/resources/native)" ]; then
              echo "产物与仓库一致，无需提交"
              exit 0
            fi
            git add utils-support-native-libjpeg-turbo/src/main/resources/native
            git commit -m "build(native): libjpeg-turbo 多平台产物"
            echo "== push branch $BRANCH =="
            git push --force "https://x-access-token:${ARTIFACT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$BRANCH"
          } 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 1200 "$LOG" | tr -d '\r' | tr '\n' '%0A')
            echo "::error title=回填失败（exit $code）::$msg"
            exit "$code"
          fi
          echo "产物已推送到 $BRANCH，等待维护者合并"
