name: native-datarecovery

# 四平台交叉编译 + 导出符号断言 + JNI 运行时冒烟（自包含，无项目依赖）。
# 产物回填到分支 build/datarecovery-native-artifacts，由维护者合并到 main。

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: '构建通过后把四平台产物提交回仓库（默认否）'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'utils-support-native-datarecovery/**'
      - '.github/workflows/native-datarecovery.yml'
  pull_request:
    paths:
      - 'utils-support-native-datarecovery/**'

concurrency:
  group: datarecovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runs-on: windows-2022
            build_os: windows
            build_arch: x86_64
            smoke: true
            lib: data_recovery_ffi.dll
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            build_os: linux
            build_arch: x86_64
            smoke: true
            lib: libdata_recovery_ffi.so
          - platform: darwin-x86_64
            # macos-15 只能跑 arm64，无 x64 JVM 做冒烟，这一腿只校验架构与导出
            runs-on: macos-15
            build_os: darwin
            build_arch: x86_64
            smoke: false
            lib: libdata_recovery_ffi.dylib
          - platform: darwin-aarch64
            runs-on: macos-15
            build_os: darwin
            build_arch: aarch64
            smoke: true
            lib: libdata_recovery_ffi.dylib
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: |
          chmod +x utils-support-native-datarecovery/src/main/rust/build.sh
          ./utils-support-native-datarecovery/src/main/rust/build.sh \
            "${{ matrix.build_os }}" "${{ matrix.build_arch }}" release

      - name: Verify artifact exists
        run: |
          path="utils-support-native-datarecovery/src/main/resources/native/${{ matrix.platform }}/${{ matrix.lib }}"
          test -f "$path" || { echo "missing artifact: $path"; exit 1; }
          ls -la "$path"
          echo "LIB_PATH=$path" >> "$GITHUB_ENV"

      - name: Check exports
        # 不用 nm 做这件事。Windows 的 Git Bash nm 不解析 PE/COFF，对 dll 只往
        # stderr 写 "no symbols"（本地实测：nm -gU 行数 0、stderr "no symbols"），
        # 而 `nm -gU ... || nm -g ...` 的兜底是**死代码**——nm -gU 退出码是 0，
        # 只输出空表，所以 exports.txt 恒为空，期望清单第一个符号必然失败。
        # run 36501877441 的 windows-x86_64 就是这样红的：`ASSERT FAIL missing export: nativeScan`。
        #
        # 期望清单原本也是错的：本模块是 JNI 模块，真实导出是
        # Java_com_chua_datarecovery_support_DataRecovery_native*（4 个 #[no_mangle]），
        # 裸名 nativeScan 只是它的尾部子串。原先那句 `grep -q nativeScan` 恰好靠
        # 子串匹配在有符号表的 linux 腿蒙对，掩盖了清单本身的问题。
        # 改成整 token 精确匹配后必须问真实名字，否则问的还是错的问题。
        #
        # tr 把所有非标识符字节（含 NUL、换行）替换成换行，每行恰好一个完整标识符，
        # 再用 grep -qxF 要求整行相等。LC_ALL=C 对 tr 和 sort 都必须加：macOS 的
        # BSD tr 在 UTF-8 locale 下遇到二进制里的非法多字节序列会报
        # "Illegal byte sequence" 并非 0 退出。Mach-O 的 C 符号带一个前导下划线
        # （`_chua_...`，dyld 解析时剥掉），故匹配集合并入「去掉一个前导下划线」的形式，
        # 同一份清单四平台通用；摘要里仍打原始 token。
        run: |
          LC_ALL=C tr -c 'A-Za-z0-9_' '\n' < "$LIB_PATH" | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols.txt"
          sed -e 's/^_//' "$RUNNER_TEMP/symbols.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_norm.txt"
          cat "$RUNNER_TEMP/symbols.txt" "$RUNNER_TEMP/symbols_norm.txt" \
            | LC_ALL=C sort -u > "$RUNNER_TEMP/symbols_match.txt"
          {
            echo "### ${{ matrix.platform }} 导出的标识符（前 40 个，共 $(wc -l < "$RUNNER_TEMP/symbols.txt") 个）"
            echo '```'
            head -40 "$RUNNER_TEMP/symbols.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          NEED="Java_com_chua_datarecovery_support_DataRecovery_nativeScan \
                Java_com_chua_datarecovery_support_DataRecovery_nativeScanAndRecover \
                Java_com_chua_datarecovery_support_DataRecovery_nativeRecover \
                Java_com_chua_datarecovery_support_DataRecovery_nativeDelete"
          for sym in $NEED; do
            if grep -qxF -- "$sym" "$RUNNER_TEMP/symbols_match.txt"; then
              echo "ASSERT ok   export $sym"
            else
              echo "ASSERT FAIL missing export: $sym"
              exit 1
            fi
          done
      - name: Check mach-o architecture
        if: matrix.build_os == 'darwin' && matrix.smoke == false
        run: |
          lipo -info "$LIB_PATH"
          lipo -archs "$LIB_PATH" | grep -q x86_64 || { echo "ASSERT FAIL not x86_64"; exit 1; }
          echo "ASSERT ok   mach-o x86_64"

      - uses: actions/setup-java@v4
        if: matrix.smoke != false
        with:
          distribution: temurin
          java-version: '25'

      - name: Runtime smoke (JNI, no project deps)
        # 冒烟只做只读的 scan；scanAndRecover / recover / permanentDelete
        # 会写盘或覆写数据，不在 CI 里调用。
        if: matrix.smoke != false
        run: |
          javac -d target/smoke \
            utils-support-native-datarecovery/src/smoke/java/com/chua/datarecovery/support/DataRecovery.java
          java -Dstdout.encoding=UTF-8 -cp target/smoke \
            com.chua.datarecovery.support.DataRecovery "$(pwd)/$LIB_PATH"

      - name: Stage artifact for upload
        run: |
          rm -rf stage
          mkdir -p stage/native/${{ matrix.platform }}
          cp "$LIB_PATH" stage/native/${{ matrix.platform }}/
          ls -la stage/native/${{ matrix.platform }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-datarecovery
          path: stage/native
          if-no-files-found: error

  collect:
    name: commit artifacts back
    needs: build
    if: >-
      always()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.commit_back))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-datarecovery'
          path: dl
          merge-multiple: true
      - name: Report build outcome per platform
        run: |
          {
            echo "### 已回填的产物"
            echo '```'
            find dl -name '*.so' -o -name '*.dylib' -o -name '*.dll' 2>/dev/null | sed 's#^dl/##' || true
            echo '```'
            echo ""
            echo "build job: ${{ needs.build.result }}；产物推送到分支 \`build/datarecovery-native-artifacts\`，请维护者合并回 main。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Place artifacts and push branch
        env:
          ARTIFACT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          set +o pipefail
          LOG="$RUNNER_TEMP/commit.log"
          BRANCH="build/datarecovery-native-artifacts"
          {
            mkdir -p utils-support-native-datarecovery/src/main/resources/native
            cp -R dl/. utils-support-native-datarecovery/src/main/resources/native/
            echo "== 待提交产物 =="
            git status --porcelain utils-support-native-datarecovery/src/main/resources/native
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            if git diff --quiet -- utils-support-native-datarecovery/src/main/resources/native \
               && [ -z "$(git ls-files --others --exclude-standard \
                    utils-support-native-datarecovery/src/main/resources/native)" ]; then
              echo "产物与仓库一致，无需提交"
              exit 0
            fi
            git add utils-support-native-datarecovery/src/main/resources/native
            git commit -m "build(native): datarecovery 四平台产物"
            echo "== push branch $BRANCH =="
            git push --force "https://x-access-token:${ARTIFACT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$BRANCH"
          } 2>&1 | tee "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 1200 "$LOG" | tr -d '\r' | tr '\n' '%0A')
            echo "::error title=回填失败（exit $code）::$msg"
            exit "$code"
          fi
          echo "产物已推送到 $BRANCH，等待维护者合并"
