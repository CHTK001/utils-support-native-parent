name: native-wechat

# 微信 WCDB 原生库多平台产物构建 + 产物校验。
#
# 与 native-libjpeg-turbo 一致的取舍：每个 job 在自己的目标平台上**原生构建**，
# 而不是交叉编译。SQLCipher + vendored OpenSSL 依赖 cc/make/perl 与平台 SDK，
# 交叉编译的工具链差异远比收益大。
#
# 运行期冒烟需要真实微信安装与数据库密钥，CI 无法提供，因此这里只做
# 产物存在性 + 二进制架构 + 导出符号校验；端到端解密读取由本地
# com.chua.nativewechat.smoke.WechatWcdbExample 覆盖。

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: '构建通过后把各平台产物提交回仓库（默认否）'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'utils-support-native-wechat/src/main/rust/**'
      - '.github/workflows/native-wechat.yml'
  pull_request:
    paths:
      - 'utils-support-native-wechat/src/main/rust/**'

concurrency:
  group: wechat-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_NAME: wechat_wcdb
  EXPORTS: >-
    wechat_wcdb_open_account
    wechat_wcdb_close_account
    wechat_wcdb_get_sessions
    wechat_wcdb_get_messages
    wechat_wcdb_get_message_count
    wechat_wcdb_get_display_names
    wechat_wcdb_free_string
    wechat_wcdb_last_error

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runs-on: windows-2022
            build_os: windows
            build_arch: x86_64
            lipo_arch: ''
            lib: wechat_wcdb.dll
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            build_os: linux
            build_arch: x86_64
            lipo_arch: ''
            lib: libwechat_wcdb.so
          - platform: darwin-x86_64
            # 托管 macOS runner 已无 Intel 镜像，只能在 arm64 上交叉编 x86_64；
            # 没有 x64 JVM 可加载它，故这一腿只验架构与导出符号。
            runs-on: macos-15
            build_os: darwin
            build_arch: x86_64
            lipo_arch: x86_64
            lib: libwechat_wcdb.dylib
          - platform: darwin-aarch64
            runs-on: macos-15
            build_os: darwin
            build_arch: aarch64
            # Rust 目标三元组叫 aarch64，Mach-O 里叫 arm64，lipo -archs 输出后者
            lipo_arch: arm64
            lib: libwechat_wcdb.dylib
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl pkg-config

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # SQLCipher 的 vendored OpenSSL 在 MSVC 下需要 nasm 生成汇编。
          # 注意：GITHUB_PATH 只对后续步骤生效，因此这里不做验证，
          # 由 Build 步骤再确认 nasm 是否真的可用。
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          Write-Host "nasm install requested"

      - name: Install Text::Template for vendored OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # openssl-src 的 Configure 在 GitHub windows-2022 镜像自带的
          # Strawberry Perl 下会以 "BEGIN failed ... OpenSSL/config.pm line 19"
          # 失败，最终报 "Error configuring OpenSSL build: 'perl' reported
          # failure with exit code: 2"。此处先探测并尝试补装。
          # 注意：macOS 的系统 perl 不需要该模块（实测其 Build 可成功），
          # 所以只有 Windows 走这条路径，且失败不阻断——真正的判定在 Build。
          perl -MText::Template -e1 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Text::Template 缺失，尝试安装..."
            cpan -T Text::Template
            perl -MText::Template -e1 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "WARN Text::Template 仍不可用；若 Build 仍失败则需改用固定版本的 Strawberry Perl"
            }
          }

      - name: Verify build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # SQLCipher 的 vendored OpenSSL 需要 perl 与 cc；两者在 macOS runner 上已具备。
          # 不强制要求 Text::Template：实测 macOS 缺少该模块时 Build 仍可成功。
          command -v perl
          command -v cc
          perl -v | head -2

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          perl -v | head -2

      - name: Build
        run: |
          set -o pipefail
          cd utils-support-native-wechat/src/main/rust
          LOG="$RUNNER_TEMP/build.log"
          {
            echo "== pwd =="; pwd
            echo "== ls =="; ls -la
            echo "== toolchain =="; cargo --version; rustc --version
            echo "== cargo metadata =="
            cargo metadata --format-version 1 --no-deps > /dev/null \
              && echo "metadata ok" || echo "metadata FAILED"
            if [ "${{ matrix.build_os }}" = "windows" ]; then
              echo "== nasm =="; nasm -v || echo "nasm unavailable"
            fi
            echo "== build.sh =="
          } 2>&1 | tee "$LOG"
          set +o pipefail
          bash ./build.sh "${{ matrix.build_os }}" "${{ matrix.build_arch }}" release 2>&1 \
            | tee -a "$LOG"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把失败原因编码成单行 workflow annotation。
            # 注解显示在 run 摘要页，即使未登录也能看到，
            # 避免"构建失败但看不到日志"的黑盒状态。
            msg=$(tail -c 1200 "$LOG" | tr -d '\r' | tr '\n' '%0A')
            echo "::error title=wechat build failed on ${{ matrix.platform }} (exit $code)::$msg"
            exit "$code"
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Verify artifact exists
        run: |
          path="utils-support-native-wechat/src/main/resources/native/${{ matrix.platform }}/${{ matrix.lib }}"
          test -f "$path" || { echo "missing artifact: $path"; exit 1; }
          ls -la "$path"
          echo "LIB_PATH=$path" >> "$GITHUB_ENV"

      - name: Verify binary architecture and exports
        run: |
          file "$LIB_PATH"
          case "$(uname -s)" in
            Darwin)
              lipo -info "$LIB_PATH"
              lipo -archs "$LIB_PATH" | grep -q "${{ matrix.lipo_arch }}" \
                || { echo "ASSERT FAIL arch mismatch: 期望 ${{ matrix.lipo_arch }}"; exit 1; }
              echo "ASSERT ok   mach-o ${{ matrix.lipo_arch }}"
              nm -gU "$LIB_PATH" > "$RUNNER_TEMP/exports.txt" || nm -g "$LIB_PATH" > "$RUNNER_TEMP/exports.txt"
              ;;
            *)
              nm -D --defined-only "$LIB_PATH" > "$RUNNER_TEMP/exports.txt" 2>/dev/null \
                || objdump -T "$LIB_PATH" | awk '{print $NF}' > "$RUNNER_TEMP/exports.txt"
              ;;
          esac
          cat "$RUNNER_TEMP/exports.txt"
          for sym in ${{ env.EXPORTS }}; do
            grep -q "$sym" "$RUNNER_TEMP/exports.txt" \
              || { echo "ASSERT FAIL missing export: $sym"; exit 1; }
            echo "ASSERT ok   export $sym"
          done

      - name: Stage artifact for upload
        run: |
          rm -rf stage
          mkdir -p stage/native/${{ matrix.platform }}
          cp "$LIB_PATH" stage/native/${{ matrix.platform }}/
          ls -la stage/native/${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-wechat-wcdb
          path: stage/native
          if-no-files-found: error

  collect:
    name: commit artifacts back
    needs: build
    # always() 而非默认的 success()：矩阵里某个平台失败（例如 Windows 的
    # vendored OpenSSL 与 runner 的 Strawberry Perl 不兼容）时，
    # 成功平台的产物仍需回填，否则一次失败就让整批产物全部丢失。
    # download-artifact 按 pattern 只取实际存在的 artifact，
    # 因此天然只收集构建成功的平台。
    if: always() && github.event_name == 'workflow_dispatch' && inputs.commit_back
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-wechat-wcdb'
          path: dl
          merge-multiple: true
      - name: Report build outcome per platform
        run: |
          echo "### 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 平台 | 结果 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "已下载的产物平台：" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dl -name '*.so' -o -name '*.dylib' -o -name '*.dll' 2>/dev/null \
            | sed 's#^dl/##' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Place and commit
        run: |
          mkdir -p utils-support-native-wechat/src/main/resources/native
          cp -R dl/. utils-support-native-wechat/src/main/resources/native/
          echo "== 待提交内容 =="
          git status --porcelain utils-support-native-wechat/src/main/resources/native
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add utils-support-native-wechat/src/main/resources/native
          if git diff --cached --quiet; then
            echo "没有产物变化，跳过提交"
          else
            git commit -m "build(native): wechat wcdb 多平台产物 [skip ci]"
            git push
          fi
