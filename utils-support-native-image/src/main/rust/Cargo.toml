[package]
name = "image_processor"
version = "0.2.0"
edition = "2021"
authors = ["CH <ch@utils.com>"]
license = "Apache-2.0"
description = "High-performance cross-platform image processing library with C ABI bindings for Java FFM"

[lib]
name = "image_processor"
crate-type = ["cdylib", "lib"]

[dependencies]
image = "0.25"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
fast_image_resize = { version = "5", features = ["image"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true