/** Aside左侧布局相关变量-结束 */

/* ==============================================
远控中心 - 现代化 UI 设计系统
参考：Vercel / Linear.app 风格
============================================== */
/* 注：本项目使用 UnoCSS (presetWind3) 作为原子化样式方案，工具类通过 UnoCSS 主题别名
   (bg-el-bg / text-el-text-primary 等) 已映射到 Element Plus CSS 变量。
   不再依赖 tailwindcss 包，避免与 UnoCSS 冲突。 */
/* ===== 1. CSS 变量定义（Element Plus 主题覆盖）===== */
:root {
  /* 主色调 - 低饱和度深灰色系，替代默认的亮蓝色 */
  --el-color-primary: rgb(75, 85, 99); /* gray-600 */
  --el-color-primary-hover: rgb(55, 65, 75); /* gray-700 */
  --el-color-primary-light-3: rgb(107, 114, 128); /* gray-500 */
  --el-color-primary-light-5: rgb(156, 163, 175); /* gray-400 */
  --el-color-primary-light-7: rgb(209, 213, 219); /* gray-300 */
  --el-color-primary-light-9: rgb(243, 244, 246); /* gray-100 */
  --el-color-primary-dark-2: rgb(31, 41, 55); /* gray-800 */
  /* RGB 变量，用于 hover 效果 */
  --el-color-primary-rgb: 75, 85, 99;
  /* 背景色 - 干净的中性色 */
  --el-bg-color: rgb(255, 255, 255);
  --el-bg-color-page: rgb(249, 250, 251); /* gray-50 */
  --el-bg-color-overlay: rgb(255, 255, 255);
  /* 文字颜色 - 高对比度 */
  --el-text-color-primary: rgb(17, 24, 39); /* gray-900 */
  --el-text-color-regular: rgb(55, 65, 81); /* gray-700 */
  --el-text-color-secondary: rgb(107, 114, 128); /* gray-500 */
  --el-text-color-placeholder: rgb(156, 163, 175); /* gray-400 */
  --el-text-color-disabled: rgb(209, 213, 219); /* gray-300 */
  /* 边框颜色 */
  --el-border-color: rgb(229, 231, 235); /* gray-200 */
  --el-border-color-light: rgb(243, 244, 246); /* gray-100 */
  --el-border-color-lighter: rgb(249, 250, 251); /* gray-50 */
  --el-border-color-darker: rgb(209, 213, 219); /* gray-300 */
  /* 填充色 */
  --el-fill-color: rgb(243, 244, 246); /* gray-100 */
  --el-fill-color-light: rgb(249, 250, 251); /* gray-50 */
  --el-fill-color-lighter: rgb(255, 255, 255); /* white */
  --el-fill-color-dark: rgb(229, 231, 235); /* gray-200 */
  /* 圆角 */
  --el-border-radius-base: 8px;
  --el-border-radius-small: 6px;
  --el-border-radius-large: 12px;
  --el-border-radius-round: 9999px;
  /* 阴影 */
  --el-box-shadow: 0 1px 3px 0 rgb(0, 0, 0, 0.1), 0 1px 2px -1px rgb(0, 0, 0, 0.1);
  --el-box-shadow-light: 0 1px 2px 0 rgb(0, 0, 0, 0.05);
  --el-box-shadow-medium: 0 4px 6px -1px rgb(0, 0, 0, 0.1), 0 2px 4px -2px rgb(0, 0, 0, 0.1);
  --el-box-shadow-large: 0 10px 15px -3px rgb(0, 0, 0, 0.1), 0 4px 6px -4px rgb(0, 0, 0, 0.1);
  /* 间距基准 */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
}

/* 暗黑模式 */
html.dark {
  --el-color-primary: rgb(107, 114, 128); /* gray-500 */
  --el-color-primary-hover: rgb(156, 163, 175); /* gray-400 */
  --el-color-primary-light-3: rgb(75, 85, 99); /* gray-600 */
  --el-color-primary-dark-2: rgb(31, 41, 55); /* gray-800 */
  --el-bg-color: rgb(17, 24, 39); /* gray-900 */
  --el-bg-color-page: rgb(15, 23, 42); /* slate-900 */
  --el-bg-color-overlay: rgb(31, 41, 55); /* gray-800 */
  --el-text-color-primary: rgb(249, 250, 251); /* gray-50 */
  --el-text-color-regular: rgb(209, 213, 219); /* gray-300 */
  --el-text-color-secondary: rgb(156, 163, 175); /* gray-400 */
  --el-text-color-placeholder: rgb(107, 114, 128); /* gray-500 */
  --el-border-color: rgb(55, 65, 81); /* gray-700 */
  --el-border-color-light: rgb(31, 41, 55); /* gray-800 */
  --el-border-color-lighter: rgb(31, 41, 55); /* gray-800 */
  --el-fill-color: rgb(31, 41, 55); /* gray-800 */
  --el-fill-color-light: rgb(15, 23, 42); /* slate-900 */
  --el-fill-color-lighter: rgb(31, 41, 55); /* gray-800 */
  --el-fill-color-dark: rgb(55, 65, 81); /* gray-700 */
  --el-box-shadow: 0 1px 3px 0 rgb(0, 0, 0, 0.5), 0 1px 2px -1px rgb(0, 0, 0, 0.5);
}

/* ===== 2. 全局基础样式 ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--el-bg-color-page);
}

body {
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: var(--el-text-color-primary);
  background: var(--el-bg-color-page);
}

#app {
  height: 100%;
}

a {
  color: var(--el-color-primary);
  text-decoration: none;
  transition: color 0.2s ease;
}
a:hover {
  color: var(--el-color-primary-hover);
}

/* ===== 3. 统一细滚动条 ===== */
.thin-scroller {
  scrollbar-width: thin;
  scrollbar-color: var(--el-border-color-darker) transparent;
}
.thin-scroller::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.thin-scroller::-webkit-scrollbar-track {
  background: transparent;
}
.thin-scroller::-webkit-scrollbar-thumb {
  background: var(--el-border-color-darker);
  border-radius: 3px;
}
.thin-scroller::-webkit-scrollbar-thumb:hover {
  background: var(--el-text-color-secondary);
}

/* ===== 4. 现代卡片组件 ===== */
.card-modern {
  background: var(--el-bg-color-overlay);
  border: 1px solid var(--el-border-color);
  border-radius: var(--el-border-radius-large);
  box-shadow: var(--el-box-shadow);
  transition: all 0.2s ease;
}
.card-modern:hover {
  box-shadow: var(--el-box-shadow-medium);
  border-color: var(--el-border-color-light);
}

.card-elevated {
  background: var(--el-bg-color-overlay);
  border: 1px solid var(--el-border-color);
  border-radius: var(--el-border-radius-large);
  box-shadow: var(--el-box-shadow-medium);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card-elevated:hover {
  transform: translateY(-1px);
  box-shadow: var(--el-box-shadow-large);
}

/* ===== 5. 毛玻璃效果 ===== */
.glass-morphism {
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.3);
}
html.dark .glass-morphism {
  background: rgba(31, 41, 55, 0.8);
  border-color: rgba(255, 255, 255, 0.1);
}

/* ===== 6. 页面布局容器 ===== */
.app-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: var(--spacing-lg);
}

.app-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto;
  background: var(--el-bg-color);
  position: relative;
}

/* ===== 7. 状态指示器 ===== */
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.status-dot.status-success {
  background: rgb(34, 197, 94); /* green-500 */
}
.status-dot.status-warning {
  background: rgb(245, 158, 11); /* amber-500 */
}
.status-dot.status-danger {
  background: rgb(239, 68, 68); /* red-500 */
}
.status-dot.status-info {
  background: rgb(59, 130, 246); /* blue-500 */
}

/* ===== 8. 动画效果 ===== */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(8px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
.animate-fade-in {
  animation: fadeIn 0.3s ease-out;
}

.animate-slide-in-right {
  animation: slideInRight 0.2s ease-out;
}

/* ===== 9. 空状态样式 ===== */
.empty-state-modern {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  color: var(--el-text-color-placeholder);
}
.empty-state-modern .empty-icon {
  opacity: 0.5;
  margin-bottom: 16px;
}
.empty-state-modern h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--el-text-color-primary);
  margin-bottom: 8px;
}
.empty-state-modern p {
  font-size: 14px;
  max-width: 280px;
  text-align: center;
}

/* ===== 10. 分割线 ===== */
.divider-modern {
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--el-text-color-secondary);
  font-size: 12px;
  font-weight: 500;
  margin: 24px 0;
}
.divider-modern::before, .divider-modern::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--el-border-color);
