[package]
name = "rust_filesearch"
version = "0.1.0"
edition = "2021"
authors = ["CH"]

[lib]
name = "file_search"
crate-type = ["cdylib", "rlib"]

[dependencies]
walkdir = "2.5"
serde_json = "1.0"
rayon = "1.12"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = true
strip = true