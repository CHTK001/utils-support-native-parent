# cargo 配置
#
# 原先此文件有两处问题，导致模块无法被任何人构建：
#   1. rustflags 行的字符串未闭合（"link-arg=-Wl,-rpath,\"
#      里的 \" 被当作转义引号），TOML 解析报 unclosed array；
#   2. [build] target 硬钉为 x86_64-unknown-linux-gnu，
#      在非 Linux 机器上直接 cargo build 会去交叉编译。
#
# 现改为：不再硬钉默认目标，由 build.sh 显式传 --target 决定；
# Linux 专用的 linker 与 rpath 保留在 target 段内，仅对 Linux 生效。

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"
# $ORIGIN 让 .so 以自身所在目录解析依赖，避免依赖被拷到别处后找不到
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
