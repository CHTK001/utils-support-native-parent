[package]
name = "metrics-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "metrics_native"
crate-type = ["cdylib"]

[dependencies]
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Power",
    "Win32_Foundation"
]}