[package]
name = "rust_filesearch"
version = "0.1.0"
edition = "2021"
authors = ["CH <ch@utils.com>"]
license = "Apache-2.0"
description = "High-performance cross-platform file search library with C ABI bindings"

[lib]
name = "rust_filesearch"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
walkdir = "2.5"
jwalk = "0.8"
byteorder = "1.4"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemServices",
    "Wdk_Storage_FileSystem",
    "Wdk_Foundation",
] }

[features]
default = []
