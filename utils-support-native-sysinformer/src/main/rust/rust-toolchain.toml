# Rust 工具链固定
#
# 为什么必须固定：GitHub runner 镜像会滚动更新，每次带上新的 Rust stable。
# 2026-10-03 实测踩到过 —— 源码、`build.sh`、`/Brepro` 全部未改动，
# 四平台产物却全部与上一次不同：
#
#   Windows  .text 差异 22,939 字节
#   macOS x86_64  __TEXT 差异 41,396 字节
#   linux .so      1,584,016 -> 1,584,048 字节
#   macOS arm64    1,122,912 -> 1,122,928 字节
#
# 体积变了、codegen 也变了 —— 这不是链接期元数据漂移，是**编译器换了**。
# 后果与「入库产物落后于源码」是同一类、而且更隐蔽：验收时的产物与交付的
# 产物不是同一个二进制，且没有任何自动化会报告这件事。
#
# 固定后，工具链升级变成一次**显式、有记录的**改动（改这个文件 + 跑一轮 CI
# 验证 + 重新入库产物），而不是某天早上 CI 突然编出不同的东西。
#
# 选 1.97.1：这是本机 rustup 上已安装、且能对本仓源码做语法检查的版本
# （`rustfmt --edition 2021 --check` 通过）。本机无 MSVC，无法本地完整
# 编译，所以「能否编过」由 CI 判定 —— workflow 里已加打印 `rustc --version`
# 的一步，失败时能立刻看出实际用的是哪个版本。
#
# 升级流程：改这里的 channel -> 提交 -> 看 CI 是否四平台仍全绿 ->
# 若绿，用 verify_delivered.py 核对并回填新产物；若红，先修代码或回退版本。
# **不要只改这里然后直接入库旧产物** —— 那正是本文件要防的事故。

[toolchain]
channel = "1.97.1"