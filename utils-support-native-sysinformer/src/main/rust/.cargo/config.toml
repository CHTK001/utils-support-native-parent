# cargo 配置
#
# 这里**不设** [build] target 的硬编码默认值：设定后在任何平台直接 cargo build
# 都会跑去交叉编译。目标一律由 build.sh 显式传 --target。
#
# Linux 专用的 linker 与 rpath 只挂在 target 段下，只在 Linux 生效。

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"
# $ORIGIN 让 .so 在自身所在目录查找依赖，便于随包分发后仍能找到
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
